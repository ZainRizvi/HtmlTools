<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and browse all public HTML gists from a GitHub user with preview links">
    <title>Gist Site Viewer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0256b9;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
        }

        .status.loading {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
        }

        .status.error {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        .gist-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .gist-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .gist-item a {
            color: #0366d6;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
        }

        .gist-item a:hover {
            text-decoration: underline;
        }

        .gist-meta {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
        }

        .gist-meta span {
            margin-right: 16px;
        }

        .gist-meta a {
            font-size: 13px;
            font-weight: normal;
        }

        .file-list {
            margin-top: 10px;
            padding-left: 20px;
        }

        .file-list li {
            margin: 6px 0;
        }

        .file-list a {
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .count {
            color: #666;
            margin-bottom: 16px;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            color: #666;
        }

        footer a {
            color: #0366d6;
        }
    </style>
</head>
<body>
    <h1>Gist Site Viewer</h1>
    <p class="description">Browse public HTML gists from any GitHub user with live preview links.</p>

    <div class="controls">
        <input type="text" id="username" placeholder="GitHub username" value="ZainRizvi">
        <button id="fetchBtn">Fetch Gists</button>
    </div>

    <div id="status" class="status"></div>

    <div id="results"></div>

    <footer>
        <a href="https://github.com/ZainRizvi/HtmlTools/blob/main/gist-site-viewer.html">View source on GitHub</a>
    </footer>

    <script>
        const usernameInput = document.getElementById('username');
        const fetchBtn = document.getElementById('fetchBtn');
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');

        // Load username from URL or localStorage
        function init() {
            const params = new URLSearchParams(window.location.search);
            const urlUsername = params.get('user');
            if (urlUsername) {
                usernameInput.value = urlUsername;
            } else {
                const stored = localStorage.getItem('gist-viewer-username');
                if (stored) {
                    usernameInput.value = stored;
                }
            }

            // Auto-fetch if username is present
            if (usernameInput.value.trim()) {
                fetchGists();
            }
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        function hideStatus() {
            statusDiv.className = 'status';
        }

        function buildPreviewUrl(gist, filename) {
            // Get the raw URL for the specific file
            const file = gist.files[filename];
            if (!file || !file.raw_url) return null;
            return 'https://htmlpreview.github.io/?' + file.raw_url;
        }

        async function fetchGists() {
            const username = usernameInput.value.trim();
            if (!username) {
                showStatus('Please enter a GitHub username', 'error');
                return;
            }

            // Save username
            localStorage.setItem('gist-viewer-username', username);

            // Update URL
            const url = new URL(window.location);
            url.searchParams.set('user', username);
            window.history.replaceState({}, '', url);

            fetchBtn.disabled = true;
            showStatus('Fetching gists...', 'loading');
            resultsDiv.innerHTML = '';

            try {
                // Fetch all pages of gists
                let allGists = [];
                let page = 1;
                const perPage = 100;

                while (true) {
                    const response = await fetch(
                        `https://api.github.com/users/${encodeURIComponent(username)}/gists?per_page=${perPage}&page=${page}`
                    );

                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error(`User "${username}" not found`);
                        }
                        throw new Error(`GitHub API error: ${response.status}`);
                    }

                    const gists = await response.json();
                    if (gists.length === 0) break;

                    allGists = allGists.concat(gists);
                    if (gists.length < perPage) break;
                    page++;
                }

                // Filter to gists that have at least one HTML file
                const htmlGists = allGists.filter(gist => {
                    return Object.keys(gist.files).some(filename =>
                        filename.toLowerCase().endsWith('.html')
                    );
                });

                // Sort by created_at descending (newest first)
                htmlGists.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                hideStatus();
                renderGists(htmlGists, username);

            } catch (error) {
                showStatus(error.message, 'error');
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function renderGists(gists, username) {
            resultsDiv.replaceChildren();

            if (gists.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-state';
                const p = document.createElement('p');
                p.textContent = `No public HTML gists found for ${username}.`;
                emptyDiv.appendChild(p);
                resultsDiv.appendChild(emptyDiv);
                return;
            }

            const countDiv = document.createElement('p');
            countDiv.className = 'count';
            countDiv.textContent = `Found ${gists.length} gist${gists.length === 1 ? '' : 's'} with HTML files`;
            resultsDiv.appendChild(countDiv);

            const list = document.createElement('ul');
            list.className = 'gist-list';

            for (const gist of gists) {
                const htmlFiles = Object.keys(gist.files).filter(filename =>
                    filename.toLowerCase().endsWith('.html')
                );

                const item = document.createElement('li');
                item.className = 'gist-item';

                // Use gist description as title, fallback to first HTML filename
                const title = gist.description || htmlFiles[0] || 'Untitled Gist';

                // If there's only one HTML file, link directly to it
                if (htmlFiles.length === 1) {
                    const previewUrl = buildPreviewUrl(gist, htmlFiles[0]);

                    const mainLink = document.createElement('a');
                    mainLink.href = previewUrl;
                    mainLink.target = '_blank';
                    mainLink.textContent = title;
                    item.appendChild(mainLink);

                    const meta = document.createElement('div');
                    meta.className = 'gist-meta';

                    const dateSpan = document.createElement('span');
                    dateSpan.textContent = 'Created: ' + formatDate(gist.created_at);
                    meta.appendChild(dateSpan);

                    const githubSpan = document.createElement('span');
                    const githubLink = document.createElement('a');
                    githubLink.href = gist.html_url;
                    githubLink.target = '_blank';
                    githubLink.textContent = 'View on GitHub';
                    githubSpan.appendChild(githubLink);
                    meta.appendChild(githubSpan);

                    item.appendChild(meta);
                } else {
                    // Multiple HTML files - show them as a sublist
                    const mainLink = document.createElement('a');
                    mainLink.href = gist.html_url;
                    mainLink.target = '_blank';
                    mainLink.textContent = title;
                    item.appendChild(mainLink);

                    const meta = document.createElement('div');
                    meta.className = 'gist-meta';

                    const dateSpan = document.createElement('span');
                    dateSpan.textContent = 'Created: ' + formatDate(gist.created_at);
                    meta.appendChild(dateSpan);

                    const countSpan = document.createElement('span');
                    countSpan.textContent = `${htmlFiles.length} HTML files`;
                    meta.appendChild(countSpan);

                    item.appendChild(meta);

                    const fileList = document.createElement('ul');
                    fileList.className = 'file-list';

                    for (const filename of htmlFiles) {
                        const previewUrl = buildPreviewUrl(gist, filename);
                        const fileLi = document.createElement('li');
                        const fileLink = document.createElement('a');
                        fileLink.href = previewUrl;
                        fileLink.target = '_blank';
                        fileLink.textContent = filename;
                        fileLi.appendChild(fileLink);
                        fileList.appendChild(fileLi);
                    }

                    item.appendChild(fileList);
                }

                list.appendChild(item);
            }

            resultsDiv.appendChild(list);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Event listeners
        fetchBtn.addEventListener('click', fetchGists);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchGists();
            }
        });

        // Initialize
        init();
    </script>
</body>
</html>
