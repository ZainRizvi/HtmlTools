		await this.store.remove("viewState", id);
	}
	saveSession(session) {
		return this.store.write("session", SESSION_KEY, session);
	}
	async loadSession() {
		const value = await this.store.read("session", SESSION_KEY);
		return isSession(value) ? value : EMPTY_SESSION;
	}
	saveViewState(id, state) {
		return this.store.write("viewState", id, state);
	}
	async loadViewState(id) {
		const value = await this.store.read("viewState", id);
		return isViewState(value) ? value : null;
	}
	saveHighlights(id, highlights) {
		return this.store.write("highlights", id, highlights);
	}
	async loadHighlights(id) {
		const value = await this.store.read("highlights", id);
		return Array.isArray(value) ? value.filter(isHighlight) : [];
	}
	saveSettings(settings) {
		return this.store.write("settings", SETTINGS_KEY, settings);
	}
	async loadSettings() {
		const value = await this.store.read("settings", SETTINGS_KEY);
		return isSettings(value) ? value : DEFAULT_SETTINGS;
	}
};

/**
* Starts the reader in the browser, wiring the adapters, engine and app together.
* @actor Reader: opens PDFs, reads them, searches, highlights and takes notes
*/
var repository = new Repository(new IndexedDbKeyValueStore());
var settings = new SettingsStore(repository);
var factory = new SessionFactory(repository, new ReadwiseSync(new ReadwiseHttpTransport()), settings, new UuidSource(), new SystemClock());
var app = new App(new PdfJsEngine(), repository, factory, settings);
document.body.append(app.element);
app.start();
