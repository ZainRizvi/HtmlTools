<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Render Markdown gists with elegant typography, table of contents, and linked footnotes">
    <title>Loading...</title>
    <meta property="og:type" content="article">
    <meta property="og:title" content="Loading...">
    <meta property="og:description" content="">

    <!-- Fonts: Cormorant Garamond for body, IBM Plex Mono for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Marked.js + DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha512-H+rglffZ6f5gF7UJgvH4Naa+fGCgjrHKMgoFOGmcPTRwR6oILo5R+gtzNrpDp7iMV3udbymBVjkeZGNz1Em4rQ==" crossorigin="anonymous"></script>

    <style>
        :root {
            --void: #08080a;
            --ink: #0c0c0e;
            --surface: #131316;
            --raised: #1a1a1f;
            --border: #252530;

            --text: #d4d4d8;
            --text-dim: #71717a;
            --text-ghost: #3f3f46;

            --accent: #00d4aa;
            --accent-dim: #00a88a;
            --accent-glow: rgba(0, 212, 170, 0.12);
            --accent-bright: #00ffcc;

            --serif: 'Cormorant Garamond', 'Times New Roman', serif;
            --mono: 'IBM Plex Mono', 'Consolas', monospace;

            --content-max: 720px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background: var(--accent);
            color: var(--void);
        }

        html {
            font-size: 19px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--serif);
            background: var(--ink);
            color: var(--text);
            line-height: 1.75;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ══════════════════════════════════════════
           AMBIENT GLOW LINE - Left edge pulse
           ══════════════════════════════════════════ */
        .glow-line {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(
                180deg,
                transparent 0%,
                var(--accent) 20%,
                var(--accent-bright) 50%,
                var(--accent) 80%,
                transparent 100%
            );
            opacity: 0;
            z-index: 100;
            box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent-dim);
            transition: opacity 0.5s ease;
        }

        .glow-line.visible {
            opacity: 0.6;
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* ══════════════════════════════════════════
           PROGRESS BAR - Top
           ══════════════════════════════════════════ */
        .progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .progress.visible { opacity: 1; }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            transition: width 0.05s linear;
        }

        /* ══════════════════════════════════════════
           LOADING STATE
           ══════════════════════════════════════════ */
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 2rem;
        }

        .loader-glyph {
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--accent);
            text-transform: uppercase;
            animation: loaderBlink 1.5s step-end infinite;
        }

        @keyframes loaderBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .loader-bar {
            width: 120px;
            height: 1px;
            background: var(--border);
            position: relative;
            overflow: hidden;
        }

        .loader-bar::after {
            content: '';
            position: absolute;
            left: -40px;
            top: 0;
            width: 40px;
            height: 100%;
            background: var(--accent);
            animation: loaderSlide 1s ease-in-out infinite;
        }

        @keyframes loaderSlide {
            0% { left: -40px; }
            100% { left: 120px; }
        }

        /* ══════════════════════════════════════════
           LANDING PAGE
           ══════════════════════════════════════════ */
        .landing {
            max-width: 540px;
            margin: 0 auto;
            padding: 120px 24px;
            text-align: center;
        }

        .landing-sigil {
            width: 64px;
            height: 64px;
            margin: 0 auto 3rem;
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .landing-sigil::before {
            content: '§';
            font-family: var(--serif);
            font-size: 2rem;
            color: var(--accent);
        }

        .landing-sigil::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 1px solid var(--border);
        }

        .landing h1 {
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 1rem;
        }

        .landing-desc {
            font-family: var(--serif);
            font-size: 1.2rem;
            font-style: italic;
            color: var(--text-dim);
            margin-bottom: 3rem;
        }

        .landing-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.5rem;
            text-align: left;
        }

        .landing-label {
            font-family: var(--mono);
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.75rem;
        }

        .landing-box p {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }

        .landing-box code {
            display: block;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text);
            padding: 1rem;
            background: var(--ink);
            border-left: 2px solid var(--accent);
            overflow-x: auto;
        }

        .landing-footer {
            margin-top: 4rem;
        }

        .landing-footer a {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--text-ghost);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .landing-footer a:hover {
            color: var(--accent);
        }

        /* ══════════════════════════════════════════
           ERROR STATE
           ══════════════════════════════════════════ */
        .error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .error h1 {
            font-family: var(--mono);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ff6b6b;
            margin-bottom: 1rem;
        }

        .error p {
            color: var(--text-dim);
            max-width: 400px;
        }

        .error-url {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--text-ghost);
            margin-top: 1.5rem;
            word-break: break-all;
        }

        /* ══════════════════════════════════════════
           MENU TOGGLE - Right side
           ══════════════════════════════════════════ */
        .menu-btn {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1001;
            width: 48px;
            height: 48px;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.3s ease;
        }

        .menu-btn.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .menu-btn:hover {
            border-color: var(--accent);
        }

        .menu-btn span {
            display: block;
            width: 18px;
            height: 1px;
            background: var(--text-dim);
            transition: all 0.3s ease;
        }

        .menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
            background: var(--accent);
        }

        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
            background: var(--accent);
        }

        /* ══════════════════════════════════════════
           TOC DRAWER - Slides from RIGHT
           ══════════════════════════════════════════ */
        .toc-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 999;
        }

        .toc-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .toc-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 360px;
            max-width: 90vw;
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toc-drawer.open {
            transform: translateX(0);
        }

        /* Scanline effect overlay */
        .toc-drawer::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 212, 170, 0.015) 2px,
                rgba(0, 212, 170, 0.015) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        .toc-head {
            padding: 6rem 2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .toc-label {
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .toc-list::-webkit-scrollbar {
            width: 2px;
        }

        .toc-list::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .toc-link {
            display: block;
            padding: 0.6rem 2rem;
            font-family: var(--serif);
            font-size: 0.95rem;
            color: var(--text-dim);
            text-decoration: none;
            transition: all 0.15s ease;
            border-right: 2px solid transparent;
        }

        .toc-link:hover {
            color: var(--text);
            background: var(--accent-glow);
            border-right-color: var(--accent);
        }

        .toc-link.active {
            color: var(--accent);
            border-right-color: var(--accent);
        }

        .toc-link.lvl-3 { padding-left: 3rem; font-size: 0.9rem; }
        .toc-link.lvl-4 { padding-left: 4rem; font-size: 0.85rem; color: var(--text-ghost); }

        /* ══════════════════════════════════════════
           ARTICLE CONTAINER
           ══════════════════════════════════════════ */
        .article {
            max-width: var(--content-max);
            margin: 0 auto;
            padding: 5rem 2rem 8rem;
            opacity: 0;
            animation: articleReveal 0.8s ease forwards;
        }

        @keyframes articleReveal {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ══════════════════════════════════════════
           TYPOGRAPHY
           ══════════════════════════════════════════ */
        .article h1 {
            font-family: var(--serif);
            font-size: 2.6rem;
            font-weight: 600;
            line-height: 1.15;
            color: var(--text);
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        .article h2 {
            font-family: var(--serif);
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--text);
            margin: 4rem 0 1.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .article h3 {
            font-family: var(--serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
            margin: 3rem 0 1rem;
        }

        .article h4 {
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 2.5rem 0 1rem;
        }

        .article p {
            margin-bottom: 1.5rem;
            color: var(--text-dim);
        }

        .article strong {
            font-weight: 600;
            color: var(--text);
        }

        .article em {
            font-style: italic;
        }

        .article a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .article a:hover {
            border-bottom-color: var(--accent);
        }

        .article hr {
            border: none;
            height: 1px;
            background: var(--border);
            margin: 3rem 0;
        }

        .article ul, .article ol {
            margin: 0 0 1.5rem 1.5rem;
            color: var(--text-dim);
        }

        .article li {
            margin-bottom: 0.4rem;
        }

        .article li::marker {
            color: var(--accent);
        }

        .article blockquote {
            margin: 2rem 0;
            padding: 1.25rem 1.5rem;
            background: var(--surface);
            border-left: 2px solid var(--accent);
            font-style: italic;
            color: var(--text-dim);
        }

        .article blockquote p:last-child {
            margin-bottom: 0;
        }

        .article code {
            font-family: var(--mono);
            font-size: 0.85em;
            background: var(--surface);
            padding: 0.15em 0.4em;
            color: var(--accent);
        }

        .article pre {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.25rem;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .article pre code {
            background: none;
            padding: 0;
            color: var(--text-dim);
        }

        /* Tables */
        .article table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 0.9rem;
        }

        .article th {
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-align: left;
            padding: 0.75rem 1rem;
            background: var(--surface);
            border-bottom: 1px solid var(--accent);
            color: var(--accent);
        }

        .article td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
        }

        .article tr:hover td {
            background: var(--accent-glow);
        }

        .article img {
            max-width: 100%;
            margin: 2rem 0;
        }

        /* ══════════════════════════════════════════
           FOOTNOTES
           ══════════════════════════════════════════ */
        .fn-ref {
            font-family: var(--mono);
            font-size: 0.65em;
            vertical-align: super;
            color: var(--accent);
            text-decoration: none;
            padding: 0 0.15em;
            cursor: pointer;
            transition: all 0.15s;
        }

        .fn-ref:hover {
            background: var(--accent);
            color: var(--void);
        }

        .fn-section {
            margin-top: 5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .fn-title {
            font-family: var(--mono);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-ghost);
            margin-bottom: 1.5rem;
        }

        .fn-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            scroll-margin-top: 100px;
            padding: 0.5rem;
            margin-left: -0.5rem;
            transition: background 0.3s;
        }

        .fn-item:target {
            background: var(--accent-glow);
        }

        .fn-num {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--accent);
            min-width: 2rem;
        }

        .fn-body {
            flex: 1;
            color: var(--text-dim);
        }

        .fn-body p {
            margin: 0;
        }

        .fn-back {
            font-family: var(--mono);
            font-size: 0.75em;
            color: var(--text-ghost);
            text-decoration: none;
            margin-left: 0.5rem;
        }

        .fn-back:hover {
            color: var(--accent);
        }

        /* ══════════════════════════════════════════
           RESPONSIVE
           ══════════════════════════════════════════ */
        @media (max-width: 768px) {
            html { font-size: 17px; }

            .article { padding: 3rem 1.25rem 5rem; }
            .article h1 { font-size: 2rem; }
            .article h2 { font-size: 1.4rem; }

            .menu-btn { top: 1rem; right: 1rem; }
            .glow-line { display: none; }
        }

        @media (max-width: 480px) {
            .article h1 { font-size: 1.75rem; }
            .landing h1 { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <!-- Ambient glow line -->
    <div class="glow-line" id="glowLine"></div>

    <!-- Progress bar -->
    <div class="progress" id="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Menu button -->
    <button class="menu-btn" id="menuBtn" aria-label="Table of contents">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- TOC overlay & drawer -->
    <div class="toc-overlay" id="tocOverlay"></div>
    <nav class="toc-drawer" id="tocDrawer">
        <div class="toc-head">
            <span class="toc-label">Contents</span>
        </div>
        <div class="toc-list" id="tocList"></div>
    </nav>

    <!-- Main content -->
    <main id="app">
        <div class="loader">
            <div class="loader-bar"></div>
            <span class="loader-glyph">Parsing...</span>
        </div>
    </main>

    <script>
    (async function() {
        const app = document.getElementById('app');
        const menuBtn = document.getElementById('menuBtn');
        const tocOverlay = document.getElementById('tocOverlay');
        const tocDrawer = document.getElementById('tocDrawer');
        const tocList = document.getElementById('tocList');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const glowLine = document.getElementById('glowLine');

        // Parse URL
        const params = new URLSearchParams(window.location.search);
        let targetUrl = params.get('url');
        if (!targetUrl) {
            const qs = window.location.search.slice(1);
            if (qs && (qs.startsWith('http://') || qs.startsWith('https://'))) {
                targetUrl = qs.split('&')[0];
            }
        }

        if (!targetUrl) {
            showLanding();
            return;
        }

        // Validate
        let url;
        try {
            url = new URL(targetUrl);
        } catch (e) {
            showError('Invalid URL', 'The provided URL could not be parsed.', targetUrl);
            return;
        }

        const allowed = ['gist.githubusercontent.com', 'raw.githubusercontent.com', 'githubusercontent.com'];
        const ok = allowed.some(d => url.hostname === d || url.hostname.endsWith('.' + d));
        if (!ok) {
            showError('Domain Restricted', 'Only GitHub raw content URLs are permitted.', targetUrl);
            return;
        }

        try {
            const res = await fetch(targetUrl);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const md = await res.text();
            render(md);
        } catch (err) {
            showError('Load Failed', err.message, targetUrl);
        }

        /* ─────────────────────────────────────────── */
        function showLanding() {
            document.title = 'Markdown Renderer';
            const host = window.location.origin + window.location.pathname;

            const div = document.createElement('div');
            div.className = 'landing';
            div.innerHTML = DOMPurify.sanitize(
                '<div class="landing-sigil"></div>' +
                '<h1>Markdown Renderer</h1>' +
                '<p class="landing-desc">Transform raw Markdown into a refined reading experience</p>' +
                '<div class="landing-box">' +
                    '<div class="landing-label">Usage</div>' +
                    '<p>Append a raw GitHub/Gist URL as query parameter:</p>' +
                    '<code>' + host + '?https://gist.githubusercontent.com/...</code>' +
                '</div>' +
                '<div class="landing-footer">' +
                    '<a href="https://github.com/ZainRizvi/HtmlTools/blob/main/markdown-renderer.html">View source</a>' +
                '</div>'
            );
            app.replaceChildren(div);
        }

        function showError(title, msg, errUrl) {
            document.title = 'Error';
            const div = document.createElement('div');
            div.className = 'error';

            const h = document.createElement('h1');
            h.textContent = title;
            div.appendChild(h);

            const p = document.createElement('p');
            p.textContent = msg;
            div.appendChild(p);

            if (errUrl) {
                const u = document.createElement('p');
                u.className = 'error-url';
                u.textContent = errUrl;
                div.appendChild(u);
            }
            app.replaceChildren(div);
        }

        /* ─────────────────────────────────────────── */
        function render(md) {
            const { content, footnotes } = extractFootnotes(md);

            marked.setOptions({ gfm: true, breaks: false });
            let html = marked.parse(content);
            html = linkFootnotes(html, footnotes);

            // Title
            const m = md.match(/^#\s+(.+)$/m);
            const title = m ? m[1].trim() : 'Untitled';
            document.title = title;
            const og = document.querySelector('meta[property="og:title"]');
            if (og) og.setAttribute('content', title);

            // Build article
            const article = document.createElement('article');
            article.className = 'article';

            const cleaned = DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
            const tmp = document.createElement('div');
            tmp.innerHTML = cleaned;
            while (tmp.firstChild) article.appendChild(tmp.firstChild);

            // Footnotes
            const fnHtml = renderFootnotes(footnotes);
            if (fnHtml) {
                const fnTmp = document.createElement('div');
                fnTmp.innerHTML = DOMPurify.sanitize(fnHtml);
                while (fnTmp.firstChild) article.appendChild(fnTmp.firstChild);
            }

            app.replaceChildren(article);

            buildTOC();
            menuBtn.classList.add('visible');
            glowLine.classList.add('visible');
            setupMenu();
            setupProgress();
            setupTOCHighlight();
        }

        /* ─────────────────────────────────────────── */
        function extractFootnotes(md) {
            const fn = {};
            const lines = md.split('\n');
            const clean = [];
            let cur = null, buf = [];

            for (const line of lines) {
                const match = line.match(/^\[\^(\d+)\]:\s*(.*)$/);
                if (match) {
                    if (cur !== null) fn[cur] = buf.join('\n').trim();
                    cur = match[1];
                    buf = [match[2]];
                } else if (cur !== null && (line.startsWith('    ') || line.startsWith('\t') || line === '')) {
                    buf.push(line.replace(/^    |\t/, ''));
                } else {
                    if (cur !== null) {
                        fn[cur] = buf.join('\n').trim();
                        cur = null;
                        buf = [];
                    }
                    clean.push(line);
                }
            }
            if (cur !== null) fn[cur] = buf.join('\n').trim();
            return { content: clean.join('\n'), footnotes: fn };
        }

        function linkFootnotes(html, fn) {
            return html.replace(/\[\^(\d+)\]/g, function(_, id) {
                if (fn[id]) {
                    return '<a href="#fn-' + id + '" id="fnref-' + id + '" class="fn-ref" title="Footnote ' + id + '">' + id + '</a>';
                }
                return _;
            });
        }

        function renderFootnotes(fn) {
            const ids = Object.keys(fn).sort((a, b) => +a - +b);
            if (!ids.length) return '';

            let out = '<section class="fn-section"><h2 class="fn-title">References</h2>';
            for (const id of ids) {
                const body = marked.parse(fn[id]);
                out += '<div class="fn-item" id="fn-' + id + '">' +
                    '<span class="fn-num">[' + id + ']</span>' +
                    '<div class="fn-body">' + body +
                        '<a href="#fnref-' + id + '" class="fn-back" title="Back">↩</a>' +
                    '</div></div>';
            }
            return out + '</section>';
        }

        /* ─────────────────────────────────────────── */
        function buildTOC() {
            const heads = document.querySelectorAll('.article h1, .article h2, .article h3, .article h4');
            tocList.replaceChildren();

            heads.forEach((h, i) => {
                if (!h.id) h.id = 'hd-' + i;
                const lvl = +h.tagName[1];

                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.className = 'toc-link' + (lvl > 2 ? ' lvl-' + lvl : '');
                a.textContent = h.textContent;
                a.dataset.target = h.id;

                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    closeTOC();
                    setTimeout(() => {
                        document.getElementById(this.dataset.target)?.scrollIntoView({ behavior: 'smooth' });
                    }, 300);
                });

                tocList.appendChild(a);
            });
        }

        function setupMenu() {
            menuBtn.addEventListener('click', () => {
                tocDrawer.classList.contains('open') ? closeTOC() : openTOC();
            });
            tocOverlay.addEventListener('click', closeTOC);
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && tocDrawer.classList.contains('open')) closeTOC();
            });
        }

        function openTOC() {
            tocDrawer.classList.add('open');
            tocOverlay.classList.add('open');
            menuBtn.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeTOC() {
            tocDrawer.classList.remove('open');
            tocOverlay.classList.remove('open');
            menuBtn.classList.remove('active');
            document.body.style.overflow = '';
        }

        function setupProgress() {
            progress.classList.add('visible');
            const update = () => {
                const st = window.scrollY;
                const dh = document.documentElement.scrollHeight - window.innerHeight;
                progressFill.style.width = (dh > 0 ? (st / dh) * 100 : 0) + '%';
            };
            window.addEventListener('scroll', update, { passive: true });
            update();
        }

        function setupTOCHighlight() {
            const heads = document.querySelectorAll('.article h1, .article h2, .article h3, .article h4');
            const links = document.querySelectorAll('.toc-link');
            if (!heads.length) return;

            const obs = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        links.forEach(l => l.classList.remove('active'));
                        const active = tocList.querySelector('[data-target="' + e.target.id + '"]');
                        if (active) active.classList.add('active');
                    }
                });
            }, { rootMargin: '-80px 0px -60% 0px' });

            heads.forEach(h => obs.observe(h));
        }
    })();
    </script>
</body>
</html>
