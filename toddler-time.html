<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Full-screen toddler play space with colorful mouse magic and flying letters for every key press.">
    <title>Toddler Time</title>
    <!-- Created by an AI assistant session (ChatGPT) on request: playful mouse and keyboard interactions for toddlers. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bgx: 50%;
            --bgy: 50%;
            --bg-1: #05060f;
            --bg-2: #0b1c2f;
            --bg-3: #122b45;
            --sparkle-lightness: 78;
            --sparkle-opacity: 0.92;
            --sparkle-hue-base: 190;
            --sparkle-hue-range: 260;
            --shadow-1: rgba(0, 0, 0, 0.45);
            --shadow-2: rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Fredoka", "Sniglet", "Comic Sans MS", system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at var(--bgx) var(--bgy), var(--bg-1), var(--bg-2) 44%, var(--bg-3) 96%);
            transition: background-position 0.08s ease-out, background 1.2s ease;
        }

        #play-area {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            cursor: crosshair;
            touch-action: none;
        }

        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.35);
            color: #fffaf3;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            backdrop-filter: blur(6px);
            max-width: 320px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            z-index: 5;
        }

        .hud strong {
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .fullscreen-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            z-index: 6;
            padding: 0;
            transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
            backdrop-filter: blur(6px);
            touch-action: manipulation;
        }

        .fullscreen-btn:hover,
        .fullscreen-btn:focus-visible {
            transform: translateY(-1px) scale(1.02);
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
        }

        .fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .fullscreen-btn .exit {
            opacity: 0;
        }

        .fullscreen-btn.is-exit .enter {
            opacity: 0;
        }

        .fullscreen-btn.is-exit .exit {
            opacity: 1;
        }

        .footer {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: #f7f7f7;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 13px;
            text-decoration: none;
            backdrop-filter: blur(4px);
            z-index: 5;
        }

        .floating-letter {
            position: absolute;
            left: var(--slot-left, 50%);
            top: var(--slot-top, 55%);
            transform: translate(-50%, -50%);
            display: inline-block;
            font-family: "Sniglet", "Fredoka", "Comic Sans MS", sans-serif;
            font-size: clamp(220px, 24vw, 320px);
            color: var(--letter-color, #fffdf7);
            text-shadow:
                0 0 22px var(--shadow-1),
                0 0 32px var(--shadow-2),
                0 0 48px var(--letter-color, #fffdf7);
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.25));
            opacity: 0;
        }

        .mouse-bubble {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 255, 255, 1), rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0));
            mix-blend-mode: screen;
            filter: blur(0.5px);
            opacity: 0.92;
            box-shadow:
                0 0 24px rgba(255, 255, 255, 0.95),
                0 0 46px rgba(255, 255, 255, 0.55),
                0 0 68px rgba(255, 255, 255, 0.35);
        }

        .mouse-bubble::after {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
        }

        #letter-line {
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            transform: none;
            pointer-events: none;
            z-index: 4;
            overflow: visible;
        }

        @keyframes letter-pop {
            0% {
                transform: translate(-50%, -70%) scale(0.55) rotate(0deg);
                opacity: 0;
            }
            35% {
                transform: translate(-50%, -52%) scale(1.08) rotate(var(--spin));
                opacity: 1;
            }
            55% {
                transform: translate(-50%, -50%) scale(1) rotate(calc(var(--spin) * -0.4));
                opacity: 1;
            }
            90% {
                transform: translate(-50%, -48%) scale(0.98) rotate(calc(var(--spin) * 0.15));
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -46%) scale(0.96) rotate(calc(var(--spin) * 0.25));
                opacity: 1;
            }
        }

        @keyframes bubble-pop {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.8);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .hud {
                max-width: 260px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div id="play-area" aria-live="polite" aria-label="Colorful play space for typing and moving the mouse">
    <div class="hud">
        <strong>Toddler Time</strong><br>
        A cozy, fullscreen playground for toddlers to explore colors, letters, and sparkles.
    </div>
    <button id="fullscreen-btn" class="fullscreen-btn" aria-label="Enter full screen" title="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="enter" d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zm-11 11h2v5h5v2H3v-7zm16 0h2v7h-7v-2h5v-5z"/>
            <path class="exit" d="M3 9h2V5h4V3H3v6zm12-6v2h4v4h2V3h-6zm-12 12v6h6v-2H5v-4H3zm14 4h-4v2h6v-6h-2v4z"/>
        </svg>
    </button>
    <div id="letter-line" aria-live="polite"></div>
</div>

<!-- MODULE: Tiny math + DOM helpers
     Small helpers for randomness and element cleanup. Copy to any single-file tool that needs them.
-->
<script>
    function randomRange(min, max) {
        return Math.random() * (max - min) + min;
    }

    function removeOnFinish(animation, element) {
        animation.addEventListener("finish", () => element.remove());
    }
</script>

     Letter colors stay untouched; shadows and sparkles adjust per theme for readability.
-->
<script>
    (function initThemeCycler() {

            },
            {

                bg1: "#130a1e",
                bg2: "#27163e",
                bg3: "#4c2c75",
                sparkles: { base: 300, range: 200, lightness: 82, opacity: 0.9 },
                shadows: { one: "rgba(0, 0, 0, 0.55)", two: "rgba(0, 0, 0, 0.32)" }
            },
            {
                name: "Sunset Drift",
                bg1: "#1a0c0b",

            },
            {

                bg1: "#08151d",
                bg2: "#0c2f3a",
                bg3: "#11575b",
                sparkles: { base: 170, range: 180, lightness: 78, opacity: 0.9 },
                shadows: { one: "rgba(0, 0, 0, 0.46)", two: "rgba(0, 0, 0, 0.27)" }
            },
            {
                name: "Orchid Night",
                bg1: "#1a0d16",
                bg2: "#2c1630",
                bg3: "#452448",
                sparkles: { base: 320, range: 150, lightness: 83, opacity: 0.9 },
                shadows: { one: "rgba(0, 0, 0, 0.54)", two: "rgba(0, 0, 0, 0.3)" }
            },
            {
                name: "Glacier",
                bg1: "#0a0f16",
                bg2: "#10263a",
                bg3: "#1c4e68",
                sparkles: { base: 205, range: 120, lightness: 82, opacity: 0.88 },
                shadows: { one: "rgba(0, 0, 0, 0.46)", two: "rgba(0, 0, 0, 0.26)" }

            {
                name: "Citrus Grove",
                bg1: "#0b120b",

                shadows: { one: "rgba(0, 0, 0, 0.48)", two: "rgba(0, 0, 0, 0.28)" }

        let current = 0;

        function applyTheme(theme) {
            const { sparkles, shadows } = theme;
            rootStyle.setProperty("--bg-1", theme.bg1);
            rootStyle.setProperty("--bg-2", theme.bg2);
            rootStyle.setProperty("--bg-3", theme.bg3);
            rootStyle.setProperty("--sparkle-hue-base", sparkles.base);

            rootStyle.setProperty("--shadow-2", shadows.two);
            body.style.background = `radial-gradient(circle at var(--bgx) var(--bgy), ${theme.bg1}, ${theme.bg2} 44%, ${theme.bg3} 96%)`;
        }

        applyTheme(themes[current]);

        document.addEventListener("keydown", (event) => {
            if (event.key === "Shift" && !event.repeat) {
                current = (current + 1) % themes.length;
                applyTheme(themes[current]);
            }
        });
    })();
</script>

<!-- MODULE: Mouse sparkle painter
     Updates the gradient focus point and spawns gentle bubbles following the cursor.
     Copy this block to any tool that needs playful mouse-driven feedback.
-->
<script>
    (function initMousePainter() {
        const playArea = document.getElementById("play-area");
        const rootStyle = document.documentElement.style;

        function updateBackground(event) {
            const xPercent = (event.clientX / window.innerWidth) * 100;
            const yPercent = (event.clientY / window.innerHeight) * 100;
            rootStyle.setProperty("--bgx", `${xPercent}%`);
            rootStyle.setProperty("--bgy", `${yPercent}%`);
        }

        function spawnBubbleAt(x, y) {
            const bubble = document.createElement("div");
            bubble.className = "mouse-bubble";
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;
            const computed = getComputedStyle(document.documentElement);
            const baseHue = parseFloat(computed.getPropertyValue("--sparkle-hue-base")) || 180;
            const hueRange = parseFloat(computed.getPropertyValue("--sparkle-hue-range")) || 240;
            const hue = ((randomRange(baseHue - hueRange / 2, baseHue + hueRange / 2) % 360) + 360) % 360;
            const sparkleLightness = parseFloat(computed.getPropertyValue("--sparkle-lightness")) || 78;
            const sparkleOpacity = parseFloat(computed.getPropertyValue("--sparkle-opacity")) || 0.92;
            const glowLightness = Math.min(sparkleLightness + 8, 96);
            const midLightness = Math.max(sparkleLightness - 10, 48);

            bubble.style.background = `radial-gradient(circle, hsla(${hue}, 100%, ${glowLightness}%, 1), hsla(${hue}, 100%, ${sparkleLightness}%, ${sparkleOpacity}), hsla(${hue}, 100%, ${midLightness}%, 0))`;
            bubble.style.boxShadow = `
                0 0 24px hsla(${hue}, 100%, ${glowLightness}%, ${Math.min(sparkleOpacity + 0.06, 1)}),
                0 0 46px hsla(${hue}, 100%, ${sparkleLightness}%, ${Math.max(sparkleOpacity - 0.12, 0.3)}),
                0 0 68px hsla(${hue}, 100%, ${midLightness}%, 0.32)`;
            bubble.style.filter = "blur(0.4px)";

            playArea.appendChild(bubble);

            const driftX = randomRange(-40, 40);
            const driftY = randomRange(-60, 20);
            const animation = bubble.animate([
                { transform: "translate(-50%, -50%) scale(0.4)", opacity: 0.0 },
                { transform: `translate(calc(-50% + ${driftX}px), calc(-50% + ${driftY}px)) scale(1.6)`, opacity: 0.92 },
                { transform: `translate(calc(-50% + ${driftX * 1.2}px), calc(-50% + ${driftY * 1.4}px)) scale(2.1)`, opacity: 0 }
            ], {
                duration: 900,
                easing: "ease-out",
                fill: "forwards"
            });

            removeOnFinish(animation, bubble);
        }

        let lastBubble = 0;
        playArea.addEventListener("pointermove", (event) => {
            updateBackground(event);
            const now = performance.now();
            if (now - lastBubble > 20) {
                spawnBubbleAt(event.clientX, event.clientY);
                lastBubble = now;
            }
        });

        window.toddlerBubbles = { spawnBubbleAt };
    })();
</script>

<!-- MODULE: Keyboard toss letters
     Catches letter/number key presses and throws giant typewriter-style characters that line up.
     Copy to any tool that needs lively typing feedback for kids.
-->
<script>
    (function initKeyboardToss() {
        const letterLine = document.getElementById("letter-line");
        const MIN_LIFETIME = 3200; // Keep visible for at least a couple of seconds
        const MAX_LIFETIME = 5800;
        const MAX_SLOTS = 18;
        const slots = Array(MAX_SLOTS).fill(null);
        const letters = new Map();
        const slotPositions = buildSlotPositions(MAX_SLOTS);

        function isTypeableKey(event) {
            return /^[a-z0-9]$/i.test(event.key);
        }

        function randomChar() {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            return alphabet[Math.floor(Math.random() * alphabet.length)];
        }

        function makeLetter(char) {
            const letter = document.createElement("div");
            letter.className = "floating-letter";
            letter.textContent = char.toUpperCase();
            const spin = `${randomRange(-22, 22)}deg`;
            letter.style.setProperty("--spin", spin);
            letter.style.setProperty("--slot-top", "55%");
            letter.style.setProperty("--letter-color", colorForChar(char.toUpperCase()));
            return letter;
        }

        function colorForChar(char) {
            const palette = [
                "#ffffff", "#ff5f5f", "#ffd166", "#06d6a0", "#26547c", "#ef476f",
                "#7c3aed", "#ff9f1c", "#2ec4b6", "#ff6f91", "#5ce1e6", "#f9f871",
                "#b5179e", "#4895ef", "#06a77d", "#f8961e", "#ee6c4d", "#8ac926",
                "#ffcad4", "#9b5de5", "#f15bb5", "#00bbf9", "#fee440", "#6fffe9",
                "#ffb5a7", "#e07a5f", "#81b29a", "#f4a261", "#e76f51", "#ff6d00",
                "#00c2cb", "#f3722c", "#90be6d", "#577590", "#ffb703", "#219ebc"
            ];
            const code = char.charCodeAt(0);
            return palette[code % palette.length];
        }

        function reserveSlot(preferred) {
            const openIndices = slots
                .map((val, idx) => (val === null ? idx : -1))
                .filter(idx => idx !== -1);

            if (openIndices.length) {
                if (preferred) {
                    let best = openIndices[0];
                    let bestDist = Infinity;
                    openIndices.forEach(idx => {
                        const pos = slotPositions[idx];
                        const dx = pos.left - preferred.left;
                        const dy = pos.top - preferred.top;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < bestDist) {
                            bestDist = dist;
                            best = idx;
                        }
                    });
                    return best;
                }
                return openIndices[0];
            }
            // If all slots are used, reuse the oldest letter's slot
            let oldestChar = null;
            let oldestExpire = Infinity;
            letters.forEach((info, char) => {
                if (info.expiresAt < oldestExpire) {
                    oldestExpire = info.expiresAt;
                    oldestChar = char;
                }
            });
            if (oldestChar) {
                const info = letters.get(oldestChar);
                fallLetter(info);
                return info.slotIndex;
            }
            return Math.max(0, slots.length - 1);
        }

        function buildSlotPositions(count) {
            const positions = [];
            let attempts = 0;
            while (positions.length < count && attempts < 400) {
                const candidate = {
                    left: randomRange(10, 90),
                    top: randomRange(8, 88)
                };
                const farEnough = positions.every(pos => {
                    const dx = pos.left - candidate.left;
                    const dy = pos.top - candidate.top;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    return dist > 11; // avoid overlaps
                });
                if (farEnough) positions.push(candidate);
                attempts++;
            }
            // If we failed to place enough, fill remaining in a loose grid
            while (positions.length < count) {
                positions.push({ left: 10 + (positions.length % 6) * 14, top: 12 + (positions.length % 5) * 16 });
            }
            return positions;
        }

        function placeLetter(letter, slotIndex) {
            const pos = slotPositions[slotIndex];
            letter.style.setProperty("--slot-left", `${pos.left}%`);
            letter.style.setProperty("--slot-top", `${pos.top}%`);
        }

        function bounceLetter(info) {
            info.duration = randomRange(MIN_LIFETIME, MAX_LIFETIME);
            info.expiresAt = performance.now() + info.duration;
            scheduleRemoval(info);
            info.el.animate([
                { transform: "translate(-50%, -55%) scale(0.92)", offset: 0 },
                { transform: "translate(-50%, -63%) scale(1.05)", offset: 0.35 },
                { transform: "translate(-50%, -55%) scale(1)", offset: 1 }
            ], {
                duration: 520,
                easing: "ease-out"
            });
        }

        function fallLetter(info) {
            clearTimeout(info.timeoutId);
            slots[info.slotIndex] = null;
            letters.delete(info.char);
            const fall = info.el.animate([
                { transform: "translate(-50%, -45%) scale(0.98)", opacity: 1 },
                { transform: "translate(-50%, 120vh) scale(0.92) rotate(12deg)", opacity: 0 }
            ], {
                duration: 900,
                easing: "ease-in",
                fill: "forwards"
            });
            removeOnFinish(fall, info.el);
        }

        function scheduleRemoval(info) {
            clearTimeout(info.timeoutId);
            info.timeoutId = setTimeout(() => fallLetter(info), info.duration);
        }

        function popIn(info) {
            info.el.animate([
                { transform: "translate(-50%, -70%) scale(0.55) rotate(0deg)", opacity: 0 },
                { transform: "translate(-50%, -52%) scale(1.08) rotate(var(--spin))", opacity: 1, offset: 0.38 },
                { transform: "translate(-50%, -50%) scale(1) rotate(calc(var(--spin) * -0.4))", opacity: 1, offset: 0.74 },
                { transform: "translate(-50%, -48%) scale(0.98) rotate(calc(var(--spin) * 0.15))", opacity: 1, offset: 1 }
            ], {
                duration: 1200,
                easing: "cubic-bezier(0.22, 1, 0.36, 1)",
                fill: "forwards"
            });
        }

        function throwLetter(char, preferredSlot) {
            const existing = letters.get(char.toUpperCase());
            if (existing) {
                bounceLetter(existing);
                return;
            }

            const letter = makeLetter(char);
            const slotIndex = reserveSlot(preferredSlot);
            slots[slotIndex] = char.toUpperCase();
            placeLetter(letter, slotIndex);
            letterLine.appendChild(letter);

            const duration = randomRange(MIN_LIFETIME, MAX_LIFETIME);
            const info = {
                char: char.toUpperCase(),
                el: letter,
                slotIndex,
                duration,
                timeoutId: null,
                expiresAt: performance.now() + duration
            };

            letters.set(info.char, info);
            popIn(info);
            scheduleRemoval(info);
        }

        document.addEventListener("keydown", (event) => {
            if (isTypeableKey(event)) {
                event.preventDefault();
                throwLetter(event.key);
            }
        });

        window.toddlerPlay = {
            throwLetter,
            throwRandomLetter(preferredSlot) {
                throwLetter(randomChar(), preferredSlot);
            }
        };
    })();
</script>

<!-- APPLICATION: Toddler Time bootstrap
     Brings together mouse magic and keyboard tossing to fill the screen with playful feedback.
-->
<script>
    (function startApp() {
        // The modules self-initialize; this block exists for future settings or extensions.
        const playArea = document.getElementById("play-area");
        playArea.focus({ preventScroll: true });
    })();
</script>

<!-- MODULE: Fullscreen toggle
     Adds a fullscreen button and toggles icons based on state.
-->
<script>
    (function initFullscreenToggle() {
        const button = document.getElementById("fullscreen-btn");
        const playArea = document.getElementById("play-area");

        if (!document.fullscreenEnabled || !button || !playArea) {
            if (button) button.style.display = "none";
            return;
        }

        function isFullscreen() {
            return document.fullscreenElement === document.documentElement || document.fullscreenElement === playArea;
        }

        function updateState() {
            const active = isFullscreen();
            button.classList.toggle("is-exit", active);
            button.setAttribute("aria-label", active ? "Exit full screen" : "Enter full screen");
            button.setAttribute("title", active ? "Exit full screen" : "Full screen");
        }

        button.addEventListener("click", async () => {
            try {
                if (isFullscreen()) {
                    await document.exitFullscreen();
                } else {
                    // Prefer full document so address bar hides on mobile
                    await document.documentElement.requestFullscreen();
                }
            } catch (err) {
                console.warn("Fullscreen toggle failed", err);
            }
        });

        document.addEventListener("fullscreenchange", updateState);
        updateState();
    })();
</script>

<!-- MODULE: Touch and mobile interactions
     Handles taps (random letters) and swipes (sparkles) for touch devices.
-->
<script>
    (function initTouchGestures() {
        const playArea = document.getElementById("play-area");
        let active = null;

        playArea.addEventListener("pointerdown", (event) => {
            if (event.pointerType !== "touch" && event.pointerType !== "pen") return;
            active = {
                id: event.pointerId,
                startX: event.clientX,
                startY: event.clientY,
                time: performance.now(),
                moved: false
            };
        });

        playArea.addEventListener("pointermove", (event) => {
            if (!active || active.id !== event.pointerId) return;
            const dx = event.clientX - active.startX;
            const dy = event.clientY - active.startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 8) active.moved = true;
            if (window.toddlerBubbles) {
                window.toddlerBubbles.spawnBubbleAt(event.clientX, event.clientY);
            }
        });

        playArea.addEventListener("pointerup", (event) => {
            if (!active || active.id !== event.pointerId) return;
            const elapsed = performance.now() - active.time;
            const dx = event.clientX - active.startX;
            const dy = event.clientY - active.startY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (elapsed < 300 && dist < 12 && window.toddlerPlay) {
                const leftPercent = (event.clientX / window.innerWidth) * 100;
                const topPercent = (event.clientY / window.innerHeight) * 100;
                window.toddlerPlay.throwRandomLetter({ left: leftPercent, top: topPercent });
            }
            active = null;
        });

        playArea.addEventListener("pointercancel", () => { active = null; });
    })();
</script>
