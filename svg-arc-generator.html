<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate SVG arc paths and curved text with visual controls and real-time preview.">
    <title>SVG Arc & Curved Text Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-elevated: #1c1c1c;
            --surface-hover: #222222;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --text-dim: #666666;
            --accent: #00d9ff;
            --accent-dim: #00a8cc;
            --accent-glow: rgba(0, 217, 255, 0.2);
            --border: rgba(0, 217, 255, 0.2);
            --border-subtle: rgba(255, 255, 255, 0.1);
            --success: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--surface);
        }

        .header h1 {
            font-family: 'Courier Prime', monospace;
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }

        .header h1::before {
            content: '> ';
            color: var(--accent);
        }

        .container {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: calc(100vh - 80px);
        }

        /* Controls Panel */
        .controls {
            background: var(--surface);
            border-right: 1px solid var(--border-subtle);
            overflow-y: auto;
            padding: 24px;
        }

        .controls::-webkit-scrollbar {
            width: 8px;
        }

        .controls::-webkit-scrollbar-track {
            background: var(--surface);
        }

        .controls::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 4px;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-header {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .label-with-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .value-display {
            font-family: 'Courier Prime', monospace;
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
        }

        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Courier Prime', monospace;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input[type="number"]:hover,
        input[type="text"]:hover,
        select:hover {
            border-color: var(--accent);
        }

        input[type="number"] {
            cursor: ns-resize;
        }

        input[type="number"].dragging {
            cursor: ns-resize;
            user-select: none;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--surface-elevated);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-glow);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 12px var(--accent);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-glow);
            transition: all 0.2s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 12px var(--accent);
        }

        /* Angle Picker */
        .angle-picker {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 8px;
        }

        .angle-visual {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .angle-slider {
            flex: 1;
        }

        /* Color Picker */
        .color-control {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .color-input-wrapper {
            position: relative;
        }

        input[type="color"] {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            cursor: pointer;
            background: var(--surface-elevated);
            transition: all 0.2s ease;
        }

        input[type="color"]:hover {
            border-color: var(--accent);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .checkbox-wrapper:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .checkbox-wrapper label {
            margin: 0;
            cursor: pointer;
            font-size: 12px;
        }

        /* Presets */
        .presets {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .preset-btn {
            padding: 10px;
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier Prime', monospace;
        }

        .preset-btn:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background: var(--accent-dim);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Preview Panel */
        .preview {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                repeating-linear-gradient(0deg, rgba(0, 217, 255, 0.02) 0px, transparent 1px, transparent 24px),
                repeating-linear-gradient(90deg, rgba(0, 217, 255, 0.02) 0px, transparent 1px, transparent 24px);
            position: relative;
            overflow: auto;
            padding: 40px;
        }

        #svgCanvas {
            filter: drop-shadow(0 4px 20px rgba(0, 217, 255, 0.15));
        }

        .code-panel {
            background: var(--surface);
            border-top: 1px solid var(--border-subtle);
            padding: 20px 24px;
            max-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .code-header h3 {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .copy-btn {
            padding: 8px 16px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier Prime', monospace;
        }

        .copy-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .copy-btn.copied {
            background: var(--success);
            color: var(--bg);
            border-color: var(--success);
        }

        .code-output {
            flex: 1;
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 16px;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            overflow: auto;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .code-output::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .code-output::-webkit-scrollbar-track {
            background: var(--surface-elevated);
        }

        .code-output::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .controls {
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                max-height: none;
            }

            .preview-area {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SVG Arc Generator</h1>
    </div>

    <div class="container">
        <div class="controls">
            <div class="section">
                <div class="section-header">Quick Presets</div>
                <div class="presets">
                    <button class="preset-btn" onclick="loadPreset('semicircle')">Semicircle</button>
                    <button class="preset-btn" onclick="loadPreset('quarter')">Quarter</button>
                    <button class="preset-btn" onclick="loadPreset('three-quarter')">3/4 Circle</button>
                </div>
            </div>

            <div class="section">
                <div class="section-header">Canvas</div>
                <div class="control-group">
                    <label>Width × Height (px)</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <input type="number" id="canvasWidth" value="500" min="100" max="2000">
                        <input type="number" id="canvasHeight" value="500" min="100" max="2000">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">Arc Geometry</div>

                <div class="control-group">
                    <label>Center Point (X, Y)</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <input type="number" id="arcCenterX" value="250" min="0">
                        <input type="number" id="arcCenterY" value="250" min="0">
                    </div>
                </div>

                <div class="control-group">
                    <div class="label-with-value">
                        <label>Outer Radius</label>
                        <span class="value-display" id="radiusVal">150px</span>
                    </div>
                    <input type="range" id="arcRadius" value="150" min="10" max="500" step="1">
                </div>

                <div class="control-group">

                        <label>Thickness</label>

                    </div>
                    <input type="range" id="arcThickness" value="0" min="0" max="200" step="1">
                </div>

                <div class="control-group">
                    <div class="label-with-value">
                        <label>Start Angle</label>

                    <div class="angle-picker">

                        <input type="range" class="angle-slider" id="arcStartAngle" value="0" min="0" max="360" step="1">
                    </div>
                </div>

                <div class="control-group">
                    <div class="label-with-value">
                        <label>End Angle</label>
                        <span class="value-display" id="endAngleVal">180°</span>
                    </div>
                    <div class="angle-picker">
                        <svg class="angle-visual" viewBox="0 0 60 60" id="endAngleVisual"></svg>
                        <input type="range" class="angle-slider" id="arcEndAngle" value="180" min="0" max="360" step="1">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">Appearance</div>

                <div class="control-group">
                    <div class="label-with-value">
                        <label>Stroke Width</label>
                        <span class="value-display" id="strokeWidthVal">3px</span>
                    </div>
                    <input type="range" id="arcStrokeWidth" value="3" min="0" max="50" step="1">
                </div>

                <div class="control-group">
                    <label>Stroke Color</label>
                    <div class="color-control">
                        <div class="color-input-wrapper">
                            <input type="color" id="arcColor" value="#00d9ff">
                        </div>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="arcStrokeTransparent">

                <div class="control-group">
                    <label>Fill Color</label>
                    <div class="color-control">
                        <div class="color-input-wrapper">

                        </div>
                        <div class="checkbox-wrapper">

            <div class="section">
                <div class="section-header">Curved Text</div>

                <div class="control-group">

                <div class="control-group">

                        <option value="Arial">Arial</option>

            </div>
        </div>
    </div>

    <!-- MODULE: SVG Math Utilities
         Reusable functions for polar/cartesian coordinate conversion and SVG arc path generation.
         Copy this entire <script> block into any tool that needs SVG arc paths.
    -->
    <script>
        /**
         * Convert polar coordinates (angle + radius) to cartesian coordinates (x, y)
         * @param {number} centerX - X coordinate of circle center
         * @param {number} centerY - Y coordinate of circle center
         * @param {number} radius - Distance from center
         * @param {number} angleInDegrees - Angle in degrees (0° = top, increases clockwise)
         * @returns {{x: number, y: number}} Cartesian coordinates
         */
        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        }

        /**
         * Generate SVG path data for a simple arc (stroke only, no fill)
         * @param {number} x - X coordinate of arc center
         * @param {number} y - Y coordinate of arc center
         * @param {number} radius - Arc radius
         * @param {number} startAngle - Start angle in degrees
         * @param {number} endAngle - End angle in degrees
         * @returns {string} SVG path data string (for use in <path d="...">)
         */
        function describeArc(x, y, radius, startAngle, endAngle) {
            const start = polarToCartesian(x, y, radius, endAngle);
            const end = polarToCartesian(x, y, radius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";

            return [
                "M", start.x, start.y,
                "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y
            ].join(" ");
        }

        /**
         * Generate SVG path data for a thick arc (donut/ring shape with fill)
         * @param {number} x - X coordinate of arc center
         * @param {number} y - Y coordinate of arc center
         * @param {number} innerRadius - Inner radius of the ring
         * @param {number} outerRadius - Outer radius of the ring
         * @param {number} startAngle - Start angle in degrees
         * @param {number} endAngle - End angle in degrees
         * @returns {string} SVG path data string for a filled ring segment
         */
        function describeThickArc(x, y, innerRadius, outerRadius, startAngle, endAngle) {
            const outerStart = polarToCartesian(x, y, outerRadius, endAngle);
            const outerEnd = polarToCartesian(x, y, outerRadius, startAngle);
            const innerStart = polarToCartesian(x, y, innerRadius, endAngle);
            const innerEnd = polarToCartesian(x, y, innerRadius, startAngle);

            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";

            return [
                "M", outerStart.x, outerStart.y,
                "A", outerRadius, outerRadius, 0, largeArcFlag, 0, outerEnd.x, outerEnd.y,
                "L", innerEnd.x, innerEnd.y,
                "A", innerRadius, innerRadius, 0, largeArcFlag, 1, innerStart.x, innerStart.y,
                "Z"
            ].join(" ");
        }
    </script>

    <!-- MODULE: Clipboard Copy with Visual Feedback
         Generic copy-to-clipboard function with button state feedback.
         Works with any text content and any button element.
    -->
    <script>
        /**
         * Copy text to clipboard and show visual feedback on a button
         * @param {string} text - Text to copy
         * @param {HTMLElement} button - Button element to show feedback on
         * @param {Object} options - Configuration options
         * @param {string} options.successText - Text to show on success (default: 'Copied!')
         * @param {string} options.originalText - Text to restore after feedback (default: button's current text)
         * @param {string} options.successClass - CSS class to add on success (default: 'copied')
         * @param {number} options.duration - How long to show feedback in ms (default: 2000)
         */
        function copyToClipboard(text, button, options = {}) {
            const {
                successText = 'Copied!',
                originalText = button.textContent,
                successClass = 'copied',
                duration = 2000
            } = options;

            navigator.clipboard.writeText(text).then(() => {
                button.textContent = successText;
                button.classList.add(successClass);
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove(successClass);
                }, duration);
            });
        }
    </script>

    <!-- MODULE: File Download Helper
         Generic function to trigger downloads of any blob/file from the browser.
         Works with any file type (SVG, JSON, CSV, images, etc.).
    -->
    <script>
        /**
         * Trigger a file download in the browser
         * @param {string} content - File content as string
         * @param {string} filename - Name for the downloaded file
         * @param {string} mimeType - MIME type (e.g., 'image/svg+xml', 'application/json', 'text/csv')
         * @param {string} xmlHeader - Optional XML declaration to prepend (e.g., '<?xml version="1.0" encoding="UTF-8"?>')
         */
        function downloadFile(content, filename, mimeType, xmlHeader = null) {
            let fileContent = content;
            if (xmlHeader) {
                fileContent = xmlHeader + '\n' + content;
            }

            const blob = new Blob([fileContent], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>

    <!-- MODULE: Number Input Drag Enhancement
         Enhances all number inputs to allow drag-to-adjust (vertical drag = change value).
         Automatically applies to all input[type="number"] elements.
         Add CSS class 'dragging' to style the input during drag.
    -->
    <script>
        /**
         * Enable drag-to-adjust on number inputs
         * @param {string} selector - CSS selector for number inputs (default: 'input[type="number"]')
         */
        function enableNumberInputDrag(selector = 'input[type="number"]') {
            const numberInputs = document.querySelectorAll(selector);

            numberInputs.forEach(input => {
                let isDragging = false;
                let startY = 0;
                let startValue = 0;

                input.addEventListener('mousedown', function(e) {
                    isDragging = true;
                    startY = e.clientY;
                    startValue = parseFloat(this.value) || 0;
                    this.classList.add('dragging');
                    e.preventDefault();
                });

                document.addEventListener('mousemove', function(e) {
                    if (!isDragging) return;

                    const deltaY = startY - e.clientY;
                    const min = parseFloat(input.min) || -Infinity;
                    const max = parseFloat(input.max) || Infinity;
                    const step = parseFloat(input.step) || 1;

                    let newValue = startValue + (deltaY * step);
                    newValue = Math.max(min, Math.min(max, newValue));

                    input.value = Math.round(newValue);
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                });

                document.addEventListener('mouseup', function() {
                    if (isDragging) {
                        isDragging = false;
                        input.classList.remove('dragging');
                    }
                });
            });
        }
    </script>

    <!-- MODULE: Angle Visualization Widget
         Creates a visual angle picker (circle with rotating indicator line).
         Renders an SVG visualization showing the current angle.
    -->
    <script>
        /**
         * Update an angle visualization widget
         * @param {string|HTMLElement} svgElementOrId - SVG element or its ID
         * @param {number} angle - Angle in degrees (0° = top, increases clockwise)
         * @param {Object} options - Styling options
         * @param {string} options.circleStroke - Circle stroke color (default: 'rgba(0, 217, 255, 0.2)')
         * @param {string} options.lineStroke - Indicator line color (default: '#00d9ff')
         * @param {string} options.dotFill - Endpoint dot color (default: '#00d9ff')
         */
        function updateAngleVisual(svgElementOrId, angle, options = {}) {
            const {
                circleStroke = 'rgba(0, 217, 255, 0.2)',
                lineStroke = '#00d9ff',
                dotFill = '#00d9ff'
            } = options;

            const svg = typeof svgElementOrId === 'string'
                ? document.getElementById(svgElementOrId)
                : svgElementOrId;

            const cx = 30, cy = 30, r = 22;
            const angleRad = (angle - 90) * Math.PI / 180;
            const x = cx + r * Math.cos(angleRad);
            const y = cy + r * Math.sin(angleRad);

            // Clear existing content
            while (svg.firstChild) {
                svg.removeChild(svg.firstChild);
            }

            // Create circle
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', '30');
            circle.setAttribute('cy', '30');
            circle.setAttribute('r', '24');
            circle.setAttribute('fill', 'none');
            circle.setAttribute('stroke', circleStroke);
            circle.setAttribute('stroke-width', '1');
            svg.appendChild(circle);

            // Create line
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', '30');
            line.setAttribute('y1', '30');
            line.setAttribute('x2', x.toString());
            line.setAttribute('y2', y.toString());
            line.setAttribute('stroke', lineStroke);
            line.setAttribute('stroke-width', '2');
            svg.appendChild(line);

            // Create dot
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', x.toString());
            dot.setAttribute('cy', y.toString());
            dot.setAttribute('r', '3');
            dot.setAttribute('fill', dotFill);
            svg.appendChild(dot);
        }
    </script>

    <!-- MODULE: SVG Canvas Grid & Coordinates
         Adds a visual grid and coordinate system to an SVG canvas.
         Useful for debugging, education, and showing precise positioning.
    -->
    <script>
        /**
         * Add grid lines and coordinate labels to an SVG element
         * @param {SVGElement} svg - The SVG element to add the grid to
         * @param {number} width - Canvas width
         * @param {number} height - Canvas height
         * @param {Object} options - Styling and configuration options
         * @param {number} options.gridSpacing - Space between grid lines in pixels (default: 50)
         * @param {string} options.gridColor - Color of grid lines (default: 'rgba(0, 217, 255, 0.08)')
         * @param {string} options.borderColor - Color of canvas border (default: 'rgba(0, 217, 255, 0.3)')
         * @param {string} options.labelColor - Color of coordinate labels (default: 'rgba(0, 217, 255, 0.6)')
         * @param {string} options.fontFamily - Font family for labels (default: 'Courier Prime, monospace')
         * @param {boolean} options.showBorder - Whether to show canvas border (default: true)
         * @param {boolean} options.showGrid - Whether to show grid lines (default: true)
         * @param {boolean} options.showLabels - Whether to show coordinate labels (default: true)
         * @returns {SVGGElement} The group element containing all grid/coordinate elements
         */
        function addSVGCanvasGrid(svg, width, height, options = {}) {
            const {
                gridSpacing = 50,
                gridColor = 'rgba(0, 217, 255, 0.08)',
                borderColor = 'rgba(0, 217, 255, 0.3)',
                labelColor = 'rgba(0, 217, 255, 0.6)',
                fontFamily = 'Courier Prime, monospace',
                showBorder = true,
                showGrid = true,
                showLabels = true
            } = options;

            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.setAttribute('class', 'svg-canvas-grid');

            // Draw canvas border
            if (showBorder) {
                const border = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                border.setAttribute('x', '0');
                border.setAttribute('y', '0');
                border.setAttribute('width', width);
                border.setAttribute('height', height);
                border.setAttribute('fill', 'none');
                border.setAttribute('stroke', borderColor);
                border.setAttribute('stroke-width', '2');
                group.appendChild(border);
            }

            // Draw coordinate grid
            if (showGrid) {
                const gridGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                // Vertical grid lines
                for (let x = gridSpacing; x < width; x += gridSpacing) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x);
                    line.setAttribute('y1', '0');
                    line.setAttribute('x2', x);
                    line.setAttribute('y2', height);
                    line.setAttribute('stroke', gridColor);
                    line.setAttribute('stroke-width', '1');
                    gridGroup.appendChild(line);
                }

                // Horizontal grid lines
                for (let y = gridSpacing; y < height; y += gridSpacing) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', '0');
                    line.setAttribute('y1', y);
                    line.setAttribute('x2', width);
                    line.setAttribute('y2', y);
                    line.setAttribute('stroke', gridColor);
                    line.setAttribute('stroke-width', '1');
                    gridGroup.appendChild(line);
                }

                group.appendChild(gridGroup);
            }

            // Draw coordinate system indicators
            if (showLabels) {
                // (0,0) label at top-left
                const originLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                originLabel.setAttribute('x', '8');
                originLabel.setAttribute('y', '16');
                originLabel.setAttribute('fill', labelColor);
                originLabel.setAttribute('font-size', '11');
                originLabel.setAttribute('font-family', fontFamily);
                originLabel.setAttribute('font-weight', '700');
                originLabel.textContent = '(0,0)';
                group.appendChild(originLabel);

                // X axis label
                const xAxisLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                xAxisLabel.setAttribute('x', '8');
                xAxisLabel.setAttribute('y', '30');
                xAxisLabel.setAttribute('fill', labelColor);
                xAxisLabel.setAttribute('font-size', '11');
                xAxisLabel.setAttribute('font-family', fontFamily);
                xAxisLabel.setAttribute('font-weight', '700');
                xAxisLabel.textContent = 'X →';
                group.appendChild(xAxisLabel);

                // Y axis label
                const yAxisLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                yAxisLabel.setAttribute('x', '8');
                yAxisLabel.setAttribute('y', '44');
                yAxisLabel.setAttribute('fill', labelColor);
                yAxisLabel.setAttribute('font-size', '11');
                yAxisLabel.setAttribute('font-family', fontFamily);
                yAxisLabel.setAttribute('font-weight', '700');
                yAxisLabel.textContent = 'Y ↓';
                group.appendChild(yAxisLabel);

                // Bottom-right corner label
                const cornerLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                cornerLabel.setAttribute('x', width - 8);
                cornerLabel.setAttribute('y', height - 8);
                cornerLabel.setAttribute('fill', labelColor.replace('0.6', '0.4')); // Slightly dimmer
                cornerLabel.setAttribute('font-size', '10');
                cornerLabel.setAttribute('font-family', fontFamily);
                cornerLabel.setAttribute('text-anchor', 'end');
                cornerLabel.textContent = `(${width},${height})`;
                group.appendChild(cornerLabel);
            }

            return group;
        }
    </script>

    <!-- APPLICATION: SVG Arc Generator Main Logic
         This section contains the app-specific code that ties together the reusable modules above.
    -->
    <script>
        // Gather all control elements
        const controls = {
            canvasWidth: document.getElementById('canvasWidth'),
            canvasHeight: document.getElementById('canvasHeight'),
            arcCenterX: document.getElementById('arcCenterX'),
            arcCenterY: document.getElementById('arcCenterY'),
            arcRadius: document.getElementById('arcRadius'),
            arcThickness: document.getElementById('arcThickness'),
            arcStartAngle: document.getElementById('arcStartAngle'),
            arcEndAngle: document.getElementById('arcEndAngle'),
            arcStrokeWidth: document.getElementById('arcStrokeWidth'),
            arcColor: document.getElementById('arcColor'),
            arcStrokeTransparent: document.getElementById('arcStrokeTransparent'),
            arcFillColor: document.getElementById('arcFillColor'),
            arcFillTransparent: document.getElementById('arcFillTransparent'),
            textContent: document.getElementById('textContent'),
            fontFamily: document.getElementById('fontFamily'),
            fontSize: document.getElementById('fontSize'),
            fontWeight: document.getElementById('fontWeight'),
            textColor: document.getElementById('textColor'),
            textOffset: document.getElementById('textOffset')
        };

        // Update value displays next to range inputs
        function updateValueDisplays() {
            document.getElementById('radiusVal').textContent = controls.arcRadius.value + 'px';
            document.getElementById('thicknessVal').textContent = controls.arcThickness.value + 'px';
            document.getElementById('startAngleVal').textContent = controls.arcStartAngle.value + '°';
            document.getElementById('endAngleVal').textContent = controls.arcEndAngle.value + '°';
            document.getElementById('strokeWidthVal').textContent = controls.arcStrokeWidth.value + 'px';
            document.getElementById('fontSizeVal').textContent = controls.fontSize.value + 'px';
            document.getElementById('textOffsetVal').textContent = controls.textOffset.value + 'px';
        }

        // Bind angle controls to both value display and visual widget
        controls.arcStartAngle.addEventListener('input', function() {
            updateValueDisplays();
            updateAngleVisual('startAngleVisual', this.value);
            updateSVG();
        });

        controls.arcEndAngle.addEventListener('input', function() {
            updateValueDisplays();
            updateAngleVisual('endAngleVisual', this.value);
            updateSVG();
        });

        // Bind range inputs to value displays
        controls.arcRadius.addEventListener('input', function() {
            updateValueDisplays();
            updateSVG();
        });

        controls.arcThickness.addEventListener('input', function() {
            updateValueDisplays();
            updateSVG();
        });

        controls.arcStrokeWidth.addEventListener('input', function() {
            updateValueDisplays();
            updateSVG();
        });

        controls.fontSize.addEventListener('input', function() {
            updateValueDisplays();
            updateSVG();
        });

        controls.textOffset.addEventListener('input', function() {
            updateValueDisplays();
            updateSVG();
        });

        // Bind all controls to SVG update
        Object.values(controls).forEach(control => {
            control.addEventListener('input', updateSVG);
            control.addEventListener('change', updateSVG);
        });

        // Main SVG rendering function
        function updateSVG() {
            const svg = document.getElementById('svgCanvas');
            const width = parseInt(controls.canvasWidth.value);
            const height = parseInt(controls.canvasHeight.value);
            const cx = parseInt(controls.arcCenterX.value);
            const cy = parseInt(controls.arcCenterY.value);
            const outerRadius = parseInt(controls.arcRadius.value);
            const thickness = parseInt(controls.arcThickness.value);
            const innerRadius = Math.max(0, outerRadius - thickness);
            const startAngle = parseInt(controls.arcStartAngle.value);
            const endAngle = parseInt(controls.arcEndAngle.value);
            const strokeWidth = parseInt(controls.arcStrokeWidth.value);
            const strokeColor = controls.arcStrokeTransparent.checked ? 'none' : controls.arcColor.value;
            const fillColor = controls.arcFillTransparent.checked ? 'none' : controls.arcFillColor.value;
            const textContent = controls.textContent.value;
            const fontFamily = controls.fontFamily.value;
            const fontSize = parseInt(controls.fontSize.value);
            const fontWeight = controls.fontWeight.value;
            const textColor = controls.textColor.value;
            const textOffset = parseInt(controls.textOffset.value);

            svg.setAttribute('width', width);
            svg.setAttribute('height', height);
            svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

            // Clear previous content
            while (svg.firstChild) {
                svg.removeChild(svg.firstChild);
            }

            // Add grid and coordinate system (using the SVG Canvas Grid module)
            const gridGroup = addSVGCanvasGrid(svg, width, height);
            svg.appendChild(gridGroup);

            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

            // Draw the arc (use thick arc if thickness > 0, otherwise simple arc)
            if (thickness > 0) {
                const arcPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const pathData = describeThickArc(cx, cy, innerRadius, outerRadius, startAngle, endAngle);
                arcPath.setAttribute('id', 'arcPath');
                arcPath.setAttribute('d', pathData);
                arcPath.setAttribute('fill', fillColor);
                arcPath.setAttribute('stroke', strokeColor);
                arcPath.setAttribute('stroke-width', strokeWidth);
                svg.appendChild(arcPath);
            } else {
                const arcPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const pathData = describeArc(cx, cy, outerRadius, startAngle, endAngle);
                arcPath.setAttribute('id', 'arcPath');
                arcPath.setAttribute('d', pathData);
                arcPath.setAttribute('fill', 'none');
                arcPath.setAttribute('stroke', strokeColor);
                arcPath.setAttribute('stroke-width', strokeWidth);
                svg.appendChild(arcPath);
            }

            // Create text path (for curved text along the arc)
            const textPathRadius = outerRadius + textOffset;
            const textPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const textPathData = describeArc(cx, cy, textPathRadius, startAngle, endAngle);
            textPath.setAttribute('id', 'textPath');
            textPath.setAttribute('d', textPathData);
            textPath.setAttribute('fill', 'none');

            defs.appendChild(textPath);
            svg.insertBefore(defs, svg.firstChild);

            // Add curved text if content exists
            if (textContent) {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('font-family', fontFamily);
                text.setAttribute('font-size', fontSize);
                text.setAttribute('font-weight', fontWeight);
                text.setAttribute('fill', textColor);

                const textPathElement = document.createElementNS('http://www.w3.org/2000/svg', 'textPath');
                textPathElement.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#textPath');
                textPathElement.setAttribute('startOffset', '50%');
                textPathElement.setAttribute('text-anchor', 'middle');
                textPathElement.textContent = textContent;

                text.appendChild(textPathElement);
                svg.appendChild(text);
            }

            updateCodeDisplay();
        }

        // Update the code display panel
        function updateCodeDisplay() {
            const svg = document.getElementById('svgCanvas');
            const serializer = new XMLSerializer();
            let svgString = serializer.serializeToString(svg);

            svgString = svgString
                .replace(/></g, '>\n<')
                .replace(/\s+/g, ' ')
                .trim();

            document.getElementById('svgCode').textContent = svgString;
        }

        // Copy SVG code to clipboard (using the copyToClipboard module)
        function copySVGCode() {
            const codeText = document.getElementById('svgCode').textContent;
            const btn = document.querySelector('.copy-btn');
            copyToClipboard(codeText, btn);
        }

        // Download SVG file (using the downloadFile module)
        function downloadSVG() {
            const svg = document.getElementById('svgCanvas');
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svg);

            downloadFile(
                svgString,
                'arc-with-text.svg',
                'image/svg+xml',
                '<?xml version="1.0" encoding="UTF-8"?>'
            );
        }

        // Load preset configurations
        function loadPreset(preset) {
            switch(preset) {
                case 'semicircle':
                    controls.arcStartAngle.value = 0;
                    controls.arcEndAngle.value = 180;
                    controls.arcThickness.value = 0;
                    break;
                case 'quarter':
                    controls.arcStartAngle.value = 0;
                    controls.arcEndAngle.value = 90;
                    controls.arcThickness.value = 0;
                    break;
                case 'three-quarter':
                    controls.arcStartAngle.value = 0;
                    controls.arcEndAngle.value = 270;
                    controls.arcThickness.value = 0;
                    break;
            }
            updateValueDisplays();
            updateAngleVisual('startAngleVisual', controls.arcStartAngle.value);
            updateAngleVisual('endAngleVisual', controls.arcEndAngle.value);
            updateSVG();
        }

        // Initialize drag enhancement on number inputs
        enableNumberInputDrag();

        // Initialize the app
        updateValueDisplays();
        updateAngleVisual('startAngleVisual', controls.arcStartAngle.value);
        updateAngleVisual('endAngleVisual', controls.arcEndAngle.value);
        updateSVG();
    </script>
