<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Touch-friendly paint app for toddlers with bright colors and simple controls.">
    <title>Toddler Paint</title>
    <!-- Created by Claude AI: A simple painting application designed for toddlers with multi-touch support, big buttons, and vibrant colors. -->
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        body {
            background: #f5f5f5;
            display: flex;
        }

        #paint-canvas {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #f5f5dc;
            touch-action: none;
            cursor: none;
        }

        #control-panel {
            position: fixed;
            display: flex;
            background: white;
            gap: 4px;
            padding: 6px;
            flex-direction: column;
            top: 0;
            left: 0;
            width: 190px; /* updated dynamically by JS based on button size */
            max-width: 45vw;
            height: 100vh;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 50;
        }

        .button-group {
            display: grid;
            gap: 4px;
            grid-template-columns: 1fr 1fr;
        }

        .button-group.color-group {
            grid-template-columns: 1fr 1fr;
        }

        .button-group.control-group {
            grid-template-columns: 1fr 1fr;
        }

        .brush-controls-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .brush-size-preview-wrap {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5dc;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        .brush-size-preview-canvas {
            display: block;
        }

        .opacity-control {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .opacity-control label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            text-align: center;
        }

        .opacity-slider {
            width: 100%;
            height: 28px;
            margin: 0;
            accent-color: #22c55e;
            cursor: pointer;
        }

        .control-btn svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .control-btn.brush-bigger-btn svg {
            width: 42px;
            height: 42px;
        }

        .control-btn.brush-bigger-btn svg circle {
            fill: currentColor;
            stroke: none;
        }

        .button-divider {
            width: 100%;
            height: 2px;
            background: #ddd;
        }

        #fullscreen-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 46px;
            height: 46px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            z-index: 100;
            transition: all 0.15s ease;
        }

        #fullscreen-btn:hover {
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        #fullscreen-btn .exit {
            opacity: 0;
            display: none;
        }

        #fullscreen-btn.is-exit .enter {
            opacity: 0;
            display: none;
        }

        #fullscreen-btn.is-exit .exit {
            opacity: 1;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="paint-canvas"></canvas>

    <div id="control-panel">
        <!-- Color buttons will be inserted here by JavaScript -->
    </div>

    <button id="fullscreen-btn" aria-label="Enter full screen" title="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="enter" d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zm-11 11h2v5h5v2H3v-7zm16 0h2v7h-7v-2h5v-5z"/>
            <path class="exit" d="M3 9h2V5h4V3H3v6zm12-6v2h4v4h2V3h-6zm-12 12v6h6v-2H5v-4H3zm14 4h-4v2h6v-6h-2v4z"/>
        </svg>
    </button>

    <!-- MODULE: Canvas Setup & Management
         Initialize canvas and manage viewport/orientation changes.
    -->
    <script>
        /* MODULE: Canvas Setup & Management
           Initialize canvas, handle viewport/orientation changes, and manage drawing state.
        */

        const CanvasManager = (() => {
            let canvas, ctx;
            let canvasState = {
                width: 0,
                height: 0,
                panelHeight: 0,
                panelWidth: 0
            };

            function getControlPanelDimensions() {
                const panel = document.getElementById('control-panel');
                if (!panel) return { width: 0, height: 0 };
                const rect = panel.getBoundingClientRect();
                const width = Math.max(120, Math.round(rect.width || panel.offsetWidth || 190));
                return { width, height: window.innerHeight };
            }

            function updateCanvasSize() {
                const panelDims = getControlPanelDimensions();
                canvasState.panelWidth = panelDims.width;
                canvasState.panelHeight = panelDims.height;

                // Save current canvas content
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                // Calculate new size
                canvasState.width = Math.max(1, window.innerWidth - panelDims.width);
                canvasState.height = Math.max(1, window.innerHeight);

                // Update canvas
                canvas.width = canvasState.width;
                canvas.height = canvasState.height;

                // Restore canvas content if size increased
                if (imageData.width > 0 && imageData.height > 0) {
                    ctx.putImageData(imageData, 0, 0);
                }

                updateCanvasPosition();
            }

            function updateCanvasPosition() {
                canvas.style.top = '0px';
                canvas.style.left = canvasState.panelWidth + 'px';
            }

            function handleResize() {
                updateCanvasSize();
                // Dispatch custom event for other modules to know about resize
                window.dispatchEvent(new Event('canvas-resized'));
            }

            function clearCanvas() {
                ctx.fillStyle = '#f5f5dc';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            function init() {
                canvas = document.getElementById('paint-canvas');
                ctx = canvas.getContext('2d', { alpha: false });

                updateCanvasSize();
                clearCanvas();

                // Listen for resize events
                window.addEventListener('resize', handleResize);
                // Also listen for orientation change
                window.addEventListener('orientationchange', handleResize);
            }

            return {
                init,
                getCanvas: () => canvas,
                getContext: () => ctx,
                getState: () => ({ ...canvasState }),
                clearCanvas,
                updateCanvasSize,
                canvasToPageCoords(x, y) {
                    const rect = canvas.getBoundingClientRect();
                    return {
                        x: x - rect.left,
                        y: y - rect.top
                    };
                }
            };
        })();

        // Initialize canvas manager
        CanvasManager.init();
    </script>

    <!-- MODULE: Brush Engine
         Draw circular brush strokes with opacity and render cursor preview.
    -->
    <script>
        /* MODULE: Brush Engine
           Draw circular brush strokes with opacity and render cursor preview.
        */

        const BrushEngine = (() => {
            const ctx = CanvasManager.getContext();
            const canvas = CanvasManager.getCanvas();

            let brushState = {
                color: '#FF1493',      // Hot pink
                size: 85,              // Middle of 20-150 range
                opacity: 0.55,         // Master opacity (20%-100%)
                isDrawing: false
            };

            const COLORS = [
                '#FF1493', // Hot Pink
                '#87CEEB', // Sky Blue
                '#32CD32', // Lime Green
                '#FFD700', // Sunny Yellow
                '#FF8C00', // Orange
                '#9370DB', // Purple
                '#8B4513', // Brown
                '#000000', // Black
                '#FF006E', // Raspberry
                '#00E5FF', // Bright Aqua
                '#FF5252', // Coral Red
                '#FFFFFF'  // White
            ];

            function hexToRgb(hex) {
                const normalized = (hex || '').trim().replace('#', '');
                if (!normalized) return { r: 0, g: 0, b: 0 };
                if (normalized.length === 3) {
                    return {
                        r: parseInt(normalized[0] + normalized[0], 16),
                        g: parseInt(normalized[1] + normalized[1], 16),
                        b: parseInt(normalized[2] + normalized[2], 16)
                    };
                }
                if (normalized.length >= 6) {
                    return {
                        r: parseInt(normalized.slice(0, 2), 16),
                        g: parseInt(normalized.slice(2, 4), 16),
                        b: parseInt(normalized.slice(4, 6), 16)
                    };
                }
                return { r: 0, g: 0, b: 0 };
            }

            /**
             * Draw a soft brush dab (single radial gradient, same on canvas and sidebar preview).
             * @param {number} x - X coordinate
             * @param {number} y - Y coordinate
             * @param {string} color - Color to use (hex)
             * @param {number} size - Brush diameter in pixels
             */
            function drawBrushStrokeOnCtx(targetCtx, x, y, color, size, opacity) {
                targetCtx.save();
                const radius = size / 2;
                const { r, g, b } = hexToRgb(color);
                const alpha = opacity ?? brushState.opacity;

                const gradient = targetCtx.createRadialGradient(
                    x - radius * 0.12,
                    y - radius * 0.12,
                    radius * 0.08,
                    x,
                    y,
                    radius
                );
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
                gradient.addColorStop(0.55, `rgba(${r}, ${g}, ${b}, ${alpha * 0.69})`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                targetCtx.fillStyle = gradient;
                targetCtx.imageSmoothingEnabled = true;
                targetCtx.beginPath();
                targetCtx.arc(x, y, radius, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.restore();
            }

            function drawBrushStroke(x, y, color, size) {
                drawBrushStrokeOnCtx(ctx, x, y, color, size, brushState.opacity);
            }

            function getRandomColor() {
                return COLORS[Math.floor(Math.random() * COLORS.length)];
            }

            return {
                getBrushState: () => ({ ...brushState }),
                setBrushColor(color) {
                    if (COLORS.includes(color)) {
                        brushState.color = color;
                    }
                },
                getColor: () => brushState.color,
                setBrushSize(size) {
                    const clamped = Math.max(20, Math.min(150, size));
                    brushState.size = clamped;
                    return brushState.size;
                },
                getSize: () => brushState.size,
                setBrushOpacity(opacity) {
                    const clamped = Math.max(0.2, Math.min(1, opacity));
                    brushState.opacity = clamped;
                    return brushState.opacity;
                },
                getOpacity: () => brushState.opacity,
                increaseBrushSize() {
                    return this.setBrushSize(brushState.size + 15);
                },
                decreaseBrushSize() {
                    return this.setBrushSize(brushState.size - 15);
                },
                drawStroke: drawBrushStroke,
                renderStrokeToContext: (targetCtx, x, y, color, size) =>
                    drawBrushStrokeOnCtx(targetCtx, x, y, color, size, brushState.opacity),
                getRandomColor,
                getColors: () => [...COLORS]
            };
        })();
    </script>

    <!-- MODULE: Multi-touch Paint Handler
         Handle pointer events for single and multi-touch painting.
    -->
    <script>
        /* MODULE: Multi-touch Paint Handler
           Handle pointer events for single and multi-touch painting.
        */

        const TouchPaintHandler = (() => {
            const canvas = CanvasManager.getCanvas();
            const activeStrokes = new Map(); // pointerId -> {x, y, lastX, lastY}

            /**
             * Interpolate between two points and draw strokes along the path
             * Helps create smooth lines for fast strokes
             */
            function drawLineTo(fromX, fromY, toX, toY, color, size) {
                const dx = toX - fromX;
                const dy = toY - fromY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const spacing = size * 0.55;

                if (distance < spacing * 0.25) return;

                const steps = Math.ceil(distance / spacing);
                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    BrushEngine.drawStroke(
                        fromX + dx * t,
                        fromY + dy * t,
                        color,
                        size
                    );
                }
            }

            function handlePointerDown(event) {
                if (event.pointerType !== 'touch' && event.pointerType !== 'pen' && event.pointerType !== 'mouse') {
                    return;
                }

                const coords = CanvasManager.canvasToPageCoords(event.clientX, event.clientY);
                activeStrokes.set(event.pointerId, {
                    x: coords.x,
                    y: coords.y,
                    lastX: coords.x,
                    lastY: coords.y
                });

                // Draw initial point
                BrushEngine.drawStroke(coords.x, coords.y, BrushEngine.getColor(), BrushEngine.getSize());

                // Capture pointer
                canvas.setPointerCapture(event.pointerId);
            }

            function handlePointerMove(event) {
                const stroke = activeStrokes.get(event.pointerId);
                if (!stroke) return;

                const coords = CanvasManager.canvasToPageCoords(event.clientX, event.clientY);

                // Interpolate and draw line to new position
                drawLineTo(
                    stroke.lastX,
                    stroke.lastY,
                    coords.x,
                    coords.y,
                    BrushEngine.getColor(),
                    BrushEngine.getSize()
                );

                // Update position
                stroke.lastX = coords.x;
                stroke.lastY = coords.y;
            }

            function handlePointerUp(event) {
                activeStrokes.delete(event.pointerId);
                try {
                    canvas.releasePointerCapture(event.pointerId);
                } catch (e) {
                    // Pointer not captured, ignore
                }
            }

            function handlePointerCancel(event) {
                activeStrokes.delete(event.pointerId);
            }

            function handleColorChange(event) {
                // Color already changed in BrushEngine, but we could add effects here if needed
                // All active strokes will use new color on next pointermove
            }

            function handleSizeChange(event) {
                // Size already changed in BrushEngine
            }

            function init() {
                canvas.addEventListener('pointerdown', handlePointerDown);
                canvas.addEventListener('pointermove', handlePointerMove);
                canvas.addEventListener('pointerup', handlePointerUp);
                canvas.addEventListener('pointercancel', handlePointerCancel);

                // Listen for custom events from control panel
                window.addEventListener('brush-color-changed', handleColorChange);
                window.addEventListener('brush-size-changed', handleSizeChange);
            }

            return {
                init
            };
        })();

        TouchPaintHandler.init();
    </script>

    <!-- MODULE: Control Panel UI
         Render and manage color buttons and size controls.
    -->
    <script>
        /* MODULE: Control Panel UI
           Render and manage color buttons and size controls.
        */

        const ControlPanel = (() => {
            let currentSelectedColor = null;
            let colorGroup = null;
            let colorButtons = [];
            const MIN_COLORS = 8;
            const MAX_COLORS = 12;
            const PANEL_PADDING = 12;
            const GRID_GAP = 4;

            function updateBrushSizePreview() {
                const wrap = document.getElementById('brush-size-preview-wrap');
                const canvas = document.getElementById('brush-size-preview-canvas');
                if (!wrap || !canvas) return;

                // Render preview using the exact same brush algorithm as the canvas tap.
                // This makes the preview match the "single click" draw output much more closely
                // than CSS blur/gradients.
                const sizePx = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight));
                if (!sizePx) return;

                if (canvas.width !== sizePx) canvas.width = sizePx;
                if (canvas.height !== sizePx) canvas.height = sizePx;

                const pctx = canvas.getContext('2d', { alpha: true });
                if (!pctx) return;

                pctx.clearRect(0, 0, sizePx, sizePx);
                pctx.fillStyle = '#f5f5dc';
                pctx.fillRect(0, 0, sizePx, sizePx);

                const size = BrushEngine.getSize();
                // Draw at the same diameter (in CSS pixels) as the canvas tap.
                // The preview container is made large enough that the full brush + blur fits.
                const drawSize = Math.min(size, sizePx);

                BrushEngine.renderStrokeToContext(
                    pctx,
                    sizePx / 2,
                    sizePx / 2,
                    BrushEngine.getColor(),
                    drawSize
                );
            }

            function getPreferredButtonSize() {
                const shortDimension = Math.min(window.innerWidth, window.innerHeight);
                return Math.max(78, Math.min(92, Math.round(shortDimension * 0.16)));
            }

            function getBrushSectionHeight(buttonSize) {
                const opacityBlock = 17 + GRID_GAP + 28;
                return buttonSize + GRID_GAP + opacityBlock + GRID_GAP + (buttonSize * 2 + GRID_GAP) + GRID_GAP;
            }

            function getPanelWidthForColumns(buttonSize, columns) {
                return PANEL_PADDING + columns * buttonSize + (columns - 1) * GRID_GAP;
            }

            function getColorGridHeight(buttonSize, rows) {
                return rows * buttonSize + Math.max(0, rows - 1) * GRID_GAP;
            }

            const PALETTE_COLS = 2;

            function computePaletteLayout() {
                const vh = window.innerHeight;
                const maxPanelWidth = window.innerWidth * 0.45;
                const fixedAboveColors = PANEL_PADDING + 2 + GRID_GAP;

                for (let buttonSize = getPreferredButtonSize(); buttonSize >= 60; buttonSize -= 2) {
                    const brushHeight = getBrushSectionHeight(buttonSize);
                    const availableColorHeight = vh - fixedAboveColors - brushHeight;
                    const maxRows = Math.max(1, Math.floor((availableColorHeight + GRID_GAP) / (buttonSize + GRID_GAP)));
                    const panelWidth = getPanelWidthForColumns(buttonSize, PALETTE_COLS);

                    if (panelWidth > maxPanelWidth) continue;

                    const maxFitColors = Math.min(MAX_COLORS, maxRows * PALETTE_COLS);

                    for (let count = maxFitColors; count >= MIN_COLORS; count--) {
                        const rows = Math.ceil(count / PALETTE_COLS);
                        const totalHeight = fixedAboveColors + getColorGridHeight(buttonSize, rows) + brushHeight;

                        if (totalHeight <= vh) {
                            return {
                                buttonSize,
                                cols: PALETTE_COLS,
                                count,
                                rows,
                                panelWidth
                            };
                        }
                    }
                }

                const fallbackSize = 60;
                return {
                    buttonSize: fallbackSize,
                    cols: PALETTE_COLS,
                    count: MIN_COLORS,
                    rows: Math.ceil(MIN_COLORS / PALETTE_COLS),
                    panelWidth: getPanelWidthForColumns(fallbackSize, PALETTE_COLS)
                };
            }

            function getVisibleColorIndices(visibleCount) {
                const indices = [];
                for (let i = 0; i < visibleCount; i++) indices.push(i);

                const colors = BrushEngine.getColors();
                const selectedIndex = colors.indexOf(currentSelectedColor);
                if (selectedIndex >= visibleCount && selectedIndex !== -1) {
                    indices[visibleCount - 1] = selectedIndex;
                }

                return indices;
            }

            function applyColorPaletteLayout(layout) {
                if (!colorGroup || colorButtons.length === 0) return;

                const visibleIndices = getVisibleColorIndices(layout.count);

                colorGroup.style.gridTemplateColumns = '1fr 1fr';

                colorButtons.forEach((btn, index) => {
                    const visible = visibleIndices.includes(index);
                    btn.style.display = visible ? '' : 'none';
                    btn.style.width = layout.buttonSize + 'px';
                    btn.style.height = layout.buttonSize + 'px';
                    btn.style.minWidth = layout.buttonSize + 'px';
                    btn.style.minHeight = layout.buttonSize + 'px';
                });

                if (currentSelectedColor) {
                    const selectedBtn = document.querySelector(`[data-color="${currentSelectedColor}"]`);
                    if (selectedBtn && selectedBtn.style.display !== 'none') {
                        selectedBtn.setAttribute('aria-pressed', 'true');
                        const glow = `0 0 0 3px rgba(0,0,0,0.3), 0 0 12px ${currentSelectedColor}, 0 0 20px ${currentSelectedColor}`;
                        selectedBtn.style.boxShadow = glow;
                        selectedBtn.style.transform = 'scale(1.1)';
                    }
                }
            }

            function updatePanelLayout() {
                const panel = document.getElementById('control-panel');
                const layout = computePaletteLayout();

                panel.style.width = layout.panelWidth + 'px';

                const buttons = panel.querySelectorAll('button');
                buttons.forEach(btn => {
                    btn.style.width = layout.buttonSize + 'px';
                    btn.style.height = layout.buttonSize + 'px';
                    btn.style.minWidth = layout.buttonSize + 'px';
                    btn.style.minHeight = layout.buttonSize + 'px';
                });

                const previewWrap = document.getElementById('brush-size-preview-wrap');
                if (previewWrap) {
                    previewWrap.style.height = (layout.buttonSize * 2 + GRID_GAP) + 'px';
                }

                applyColorPaletteLayout(layout);
                updateBrushSizePreview();
                CanvasManager.updateCanvasSize();
            }

            function createColorButton(color) {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.dataset.color = color;
                btn.style.backgroundColor = color;
                btn.style.borderRadius = '50%';
                btn.style.border = (color.toUpperCase() === '#FFFFFF') ? '2px solid #ccc' : 'none';
                btn.style.cursor = 'pointer';
                btn.style.transition = 'all 0.15s ease';
                btn.setAttribute('aria-pressed', 'false');

                btn.addEventListener('click', () => selectColor(color, btn));
                btn.addEventListener('pointerdown', (e) => e.stopPropagation());
                btn.addEventListener('touchstart', (e) => e.stopPropagation());

                return btn;
            }

            function createControlButton(options, callback) {
                const { ariaLabel, svgMarkup } = options;
                const btn = document.createElement('button');
                btn.className = 'control-btn';
                btn.innerHTML = svgMarkup;
                btn.setAttribute('aria-label', ariaLabel);
                btn.style.borderRadius = '8px';
                btn.style.border = 'none';
                btn.style.cursor = 'pointer';
                btn.style.transition = 'all 0.15s ease';
                btn.style.color = 'white';
                btn.style.fontWeight = 'bold';
                btn.style.fontSize = '18px';
                btn.style.display = 'flex';
                btn.style.alignItems = 'center';
                btn.style.justifyContent = 'center';

                btn.addEventListener('click', callback);
                btn.addEventListener('pointerdown', (e) => e.stopPropagation());
                btn.addEventListener('touchstart', (e) => e.stopPropagation());

                return btn;
            }

            const BRUSH_SMALLER_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5"/></svg>`;
            const BRUSH_BIGGER_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/></svg>`;

            function selectColor(color, buttonElement) {
                // Remove selection from previous button
                if (currentSelectedColor) {
                    const prevBtn = document.querySelector(`[data-color="${currentSelectedColor}"]`);
                    if (prevBtn) {
                        prevBtn.setAttribute('aria-pressed', 'false');
                        prevBtn.style.boxShadow = 'none';
                        prevBtn.style.transform = 'scale(1)';
                    }
                }

                // Select new color
                currentSelectedColor = color;
                BrushEngine.setBrushColor(color);

                // Update button appearance
                buttonElement.setAttribute('aria-pressed', 'true');
                const glow = `0 0 0 3px rgba(0,0,0,0.3), 0 0 12px ${color}, 0 0 20px ${color}`;
                buttonElement.style.boxShadow = glow;
                buttonElement.style.transform = 'scale(1.1)';

                // Dispatch event for other modules
                window.dispatchEvent(new CustomEvent('brush-color-changed', { detail: { color } }));
            }

            function init() {
                const panel = document.getElementById('control-panel');
                const layout = computePaletteLayout();
                panel.style.width = layout.panelWidth + 'px';

                colorGroup = document.createElement('div');
                colorGroup.className = 'button-group color-group';
                colorGroup.style.gap = GRID_GAP + 'px';
                colorGroup.style.gridTemplateColumns = '1fr 1fr';

                const colors = BrushEngine.getColors();
                colorButtons = colors.map(color => {
                    const btn = createColorButton(color);
                    btn.style.width = layout.buttonSize + 'px';
                    btn.style.height = layout.buttonSize + 'px';
                    btn.style.minWidth = layout.buttonSize + 'px';
                    btn.style.minHeight = layout.buttonSize + 'px';
                    colorGroup.appendChild(btn);
                    return btn;
                });

                panel.appendChild(colorGroup);

                // Add divider
                const divider = document.createElement('div');
                divider.className = 'button-divider';
                divider.style.backgroundColor = '#ddd';
                divider.style.minHeight = '2px';
                divider.style.minWidth = '2px';
                divider.style.width = '100%';
                panel.appendChild(divider);

                const brushSection = document.createElement('div');
                brushSection.className = 'brush-controls-section';

                const previewWrap = document.createElement('div');
                previewWrap.id = 'brush-size-preview-wrap';
                previewWrap.className = 'brush-size-preview-wrap';
                previewWrap.style.height = (layout.buttonSize * 2 + GRID_GAP) + 'px';
                previewWrap.setAttribute('role', 'img');
                previewWrap.setAttribute('aria-label', 'Current brush size and color');

                const previewCanvas = document.createElement('canvas');
                previewCanvas.id = 'brush-size-preview-canvas';
                previewCanvas.className = 'brush-size-preview-canvas';
                // Real pixel size is set dynamically in updateBrushSizePreview().
                previewCanvas.width = 180;
                previewCanvas.height = 180;
                previewWrap.appendChild(previewCanvas);

                const controlGroup = document.createElement('div');
                controlGroup.className = 'button-group control-group';
                controlGroup.style.gap = '4px';

                const biggerBtn = createControlButton(
                    { ariaLabel: 'Bigger brush', svgMarkup: BRUSH_BIGGER_ICON },
                    () => {
                        BrushEngine.increaseBrushSize();
                        window.dispatchEvent(new CustomEvent('brush-size-changed'));
                    }
                );
                biggerBtn.classList.add('brush-bigger-btn');
                biggerBtn.style.backgroundColor = '#22c55e';
                biggerBtn.style.width = layout.buttonSize + 'px';
                biggerBtn.style.height = layout.buttonSize + 'px';
                biggerBtn.style.minWidth = layout.buttonSize + 'px';
                biggerBtn.style.minHeight = layout.buttonSize + 'px';
                controlGroup.appendChild(biggerBtn);

                const smallerBtn = createControlButton(
                    { ariaLabel: 'Smaller brush', svgMarkup: BRUSH_SMALLER_ICON },
                    () => {
                        BrushEngine.decreaseBrushSize();
                        window.dispatchEvent(new CustomEvent('brush-size-changed'));
                    }
                );
                smallerBtn.style.backgroundColor = '#f97316';
                smallerBtn.style.width = layout.buttonSize + 'px';
                smallerBtn.style.height = layout.buttonSize + 'px';
                smallerBtn.style.minWidth = layout.buttonSize + 'px';
                smallerBtn.style.minHeight = layout.buttonSize + 'px';
                controlGroup.appendChild(smallerBtn);

                brushSection.appendChild(controlGroup);

                const opacityControl = document.createElement('div');
                opacityControl.className = 'opacity-control';

                const opacityLabel = document.createElement('label');
                opacityLabel.setAttribute('for', 'brush-opacity-slider');
                opacityLabel.textContent = 'Paint strength';
                opacityControl.appendChild(opacityLabel);

                const opacitySlider = document.createElement('input');
                opacitySlider.type = 'range';
                opacitySlider.id = 'brush-opacity-slider';
                opacitySlider.className = 'opacity-slider';
                opacitySlider.min = '20';
                opacitySlider.max = '100';
                opacitySlider.step = '5';
                opacitySlider.value = String(Math.round(BrushEngine.getOpacity() * 100));
                opacitySlider.setAttribute('aria-label', 'Paint strength');
                opacitySlider.addEventListener('input', () => {
                    BrushEngine.setBrushOpacity(Number(opacitySlider.value) / 100);
                    window.dispatchEvent(new CustomEvent('brush-opacity-changed'));
                });
                opacitySlider.addEventListener('pointerdown', (e) => e.stopPropagation());
                opacitySlider.addEventListener('touchstart', (e) => e.stopPropagation());
                opacityControl.appendChild(opacitySlider);

                brushSection.appendChild(opacityControl);
                // Show the size preview below the +/- buttons.
                brushSection.appendChild(previewWrap);
                panel.appendChild(brushSection);

                applyColorPaletteLayout(layout);
                updateBrushSizePreview();
                CanvasManager.updateCanvasSize();

                window.addEventListener('brush-size-changed', updateBrushSizePreview);
                window.addEventListener('brush-color-changed', updateBrushSizePreview);
                window.addEventListener('brush-opacity-changed', updateBrushSizePreview);

                // Set initial selection to a random color
                const randomColor = BrushEngine.getRandomColor();
                const randomBtn = document.querySelector(`[data-color="${randomColor}"]`);
                if (randomBtn) {
                    selectColor(randomColor, randomBtn);
                }
                updateBrushSizePreview();

                // Listen for layout changes
                window.addEventListener('resize', updatePanelLayout);
                window.addEventListener('orientationchange', updatePanelLayout);
            }

            return {
                init
            };
        })();

        ControlPanel.init();
    </script>

    <!-- MODULE: Fullscreen Toggle
         Handle fullscreen mode with button visibility.
    -->
    <script>
        /* MODULE: Fullscreen Toggle
           Handle fullscreen mode with button visibility.
        */

        const FullscreenToggle = (() => {
            const button = document.getElementById('fullscreen-btn');

            function isFullscreen() {
                return document.fullscreenElement === document.documentElement;
            }

            function updateButtonState() {
                const active = isFullscreen();
                if (active) {
                    button.classList.add('is-exit');
                    button.style.display = 'none';
                } else {
                    button.classList.remove('is-exit');
                    button.style.display = 'flex';
                }
            }

            async function handleButtonClick() {
                try {
                    if (isFullscreen()) {
                        await document.exitFullscreen();
                    } else {
                        // Request fullscreen on document element to hide chrome
                        await document.documentElement.requestFullscreen({
                            navigationUI: 'hide'
                        });
                    }
                } catch (err) {
                    console.warn('Fullscreen toggle failed:', err);
                }
            }

            function init() {
                // Check if Fullscreen API is supported
                if (!document.fullscreenEnabled) {
                    button.style.display = 'none';
                    return;
                }

                button.addEventListener('click', handleButtonClick);
                document.addEventListener('fullscreenchange', updateButtonState);

                updateButtonState();
            }

            return {
                init
            };
        })();

        FullscreenToggle.init();
    </script>

    <!-- APPLICATION: Toddler Paint Bootstrap
         Initialize all modules and set up initial state.
    -->
    <script>
        /* APPLICATION: Toddler Paint Bootstrap
           Initialize all modules and set up initial state.
        */

        (function initApp() {
            const canvas = CanvasManager.getCanvas();
            canvas.focus();
            console.log('Toddler Paint initialized successfully!');
        })();
    </script>
